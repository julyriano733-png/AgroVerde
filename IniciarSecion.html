<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Agro Verde</title>
  <link rel="stylesheet" href="IniciarSecion.css">
</head>
<body>

  <div class="login-card">
    
<header class="header">
  <div class="header-text">
    <div class="titulo-con-icono">
      <h1>Iniciar sesión</h1>
      <img src="Agro verde.png" width="90" height="80" alt="Logo de Agro Verde">
    </div>
    <p>Ingresa tus datos para continuar</p>
  </div>
</header>

    <form class="login-form">
      
      <div class="input-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="Ingrese su correo" required>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Ingrese su contraseña" required>
      </div>

      <div class="forgot-container">
        <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn-submit">Iniciar sesión</button>
      
    </form>

    <div class="signup-container">
      <p>¿No tienes cuenta? <a href="#" class="signup-link">Regístrate</a></p>
    </div>

  </div>

</body>
</html>
