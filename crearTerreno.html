<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Agro Verde</title>
    <link rel="stylesheet" href="crearTerreno.css">
</head>

<body>

    <div class="login-card">

        <header class="header">
            <div class="header-text">
                <div class="titulo-con-icono">
                    <h1>Nuevo Terreno</h1>
                    <img src="img/Agro verde.png" width="90" height="80" alt="Logo de Agro Verde">
                </div>
                <p>Ingresa tus datos para continuar</p>
            </div>
        </header>

        <form class="login-form">

            <div class="input-group">
                <label for="nombre">Nombre de la propiedad</label>
                <input type="text" id="nombre" placeholder="Ej. napoles">
            </div>

            <div class="input-group">
                <label for="ubicacion">Ubicación</label>
                <input type="text" id="ubicacion" placeholder="Ej. sur,norte">
            </div>

            <div class="input-group">
                <label for="notas">Notas</label>
                <textarea id="notas" rows="4" placeholder="Ej. Finca, hato, lote"></textarea>
            </div>

            <div class="forgot-container">
                <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
            </div>

            <button class="boton">
                <span>Iniciar Sesión</span>
            </button>
        </form>

        <div class="signup-container">
            <p>¿No tienes cuenta? <a href="#" class="signup-link">Regístrate</a></p>
        </div>

    </div>

</body>

</html>
