<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear Cuenta-AgroVerde</title>
<link rel="stylesheet" href="crear_cuenta.css">
</head>
<body>
<div class="phone"> <!-- caja que simula un celular -->
<div class="status-bar"> <!-- barra donde va la hora -->
<span>9:41</span>
</div>

<div class="screen">
<div class="header">
<div>
<h1>Crear Cuenta</h1>
<p>Ingresa tus datos para continuar</p>
</div>
<div class="logo">
<img src="img/Logo.jpeg" alt="Logo AgroVerde">
</div>
</div>

<form>
<div class="field">
<label for="usuario">Nombre de usuario</label>
<input type="text" id="usuario" placeholder="Tu nombre">
</div>

<div class="field">
<label for="correo">Correo electrónico</label>
<input type="email" id="correo" placeholder="tu@correo.com">
</div>

<div class="field">
<label for="contrasena">Contraseña</label>
<input type="password" id="contrasena" placeholder="••••••••">
</div>
<div class="field">
    <label for="rol">ROL</label>
    <select id="rol" name="rol">
        <option value="">Selecciona tu rol</option>
        <option value="agricultor">Agricultor</option>
        <option value="administrador">Administrador</option>
        <option value="trabajador">Trabajador</option>
    </select>
</div>
</form>
</div>
</div>
</body>
</html>
