<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Agro Verde</title>
    <link rel="stylesheet" href="assets/css/iniciosecion/acceso-usuario.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark fixed-top border-bottom border-secondary shadow-sm">
        <div class="container">
            <!-- Marca o Nombre en el Navbar -->
            <a class="navbar-brand fw-bold text-primary" href="index.html">
                Mi CV
            </a>

            <!-- Botón de Hamburguesa (visible solo en celulares/tablets) -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion"
                aria-controls="menuNavegacion" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Contenido colapsable del menú -->
            <div class="collapse navbar-collapse" id="menuNavegacion">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 fw-medium">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="pages/estudios.html">Estudios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="pages/habilidades.html">Habilidades</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="pages/proyectos.html">Proyectos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="pages/contacto.html">Contacto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="cuadro-de-login">
        <!--Encabezado donde se encuentra el logo-->
        <header class="contenedor-logo">
            <img src="assets/img/agro-verde-con-texto.png" alt="Agro verde">
            
        </header>

        <!--seccion crear cuenta-->
        <section class="seccion-cuenta">
            <h2 class="title">Crea una cuenta</h2>
            <p class="subtitulo">Crea una cuenta con unos simples pasos</p>
            
            <a href="pages/crear-cuenta.html">
                <button class="boton">
                    <span>Crea una cuenta</span>
                </button>
            </a>
        </section>

        <!--seccion Iniciar sesión-->
        <section class="seccion-login">
            <h2 class="title">Iniciar Sesión</h2>
            <!--div de botones-->
            <div class="grupo-botones">
                
                <a href="pages/iniciar-sesion.html">
                    <button class="boton">
                        <span>Iniciar Sesión</span>
                    </button>
                </a>
                <button class="boton">
                    <span>Continuar con Google</span>
                    <img src="assets/img/logo-google.png" alt="Google" class="icono-boton">
                </button>
            </div>
        </section>

        <!-- Separador linea -->
        <div class="separador">
            <span>o</span>
        </div>

        <!--footer terminos y condiciones-->
        <footer class="legal">
            <p>
                Al hacer clic en continuar, aceptas nuestros
                <a href="#">Términos de servicio</a> y
                <a href="#">Política de privacidad</a>
            </p>
        </footer>
    </main>

</body>

</html>
