<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Agro Verde</title>
    <link rel="stylesheet" href="assets/css/acceso-usuario.css">
</head>

<body>

    <main class="cuadro-de-login">
        <!--Encabezado donde se encuentra el logo-->
        <header class="contenedor-logo">
            <img src="assets/img/Agro verde.png" alt="Agro verde">
            <h1>AGRO VERDE</h1>
        </header>

        <!--seccion crear cuenta-->
        <section class="seccion-cuenta">
            <h2 class="title">Crea una cuenta</h2>
            <p class="subtitulo">Crea una cuenta con unos simples pasos</p>

            <button class="boton">
                <span>Crea una cuenta</span>
            </button>
        </section>

        <!--seccion Iniciar sesión-->
        <section class="seccion-login">
            <h2 class="title">Iniciar Sesión</h2>
            <!--div de botones-->
            <div class="grupo-botones">
                <button class="boton">
                    <span>Iniciar Sesión</span>
                </button>
                <button class="boton">
                    <span>Continuar con Google</span>
                    <img src="assets/img/logoGoogle.png" alt="Google" class="icono-boton">
                </button>
            </div>
        </section>

        <!-- Separador linea -->
        <div class="separador">
            <span>o</span>
        </div>

        <!--footer terminos y condiciones-->
        <footer class="legal">
            <p>
                Al hacer clic en continuar, aceptas nuestros
                <a href="#">Términos de servicio</a> y
                <a href="#">Política de privacidad</a>
            </p>
        </footer>
    </main>
</body>

</html>
