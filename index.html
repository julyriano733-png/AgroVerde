<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Agro Verde</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/iniciosecion/iniciar-sesion.css">
</head>

<body>

    <main class="cuadro-de-login">
        <header class="contenedor-logo">
            <img src="assets/img/agro-verde-con-texto.png" alt="Agro verde">
        </header>

        <section class="seccion-cuenta">
            <h2 class="title">Crea una cuenta</h2>
            <p class="subtitulo">Crea una cuenta con unos simples pasos</p>

            <a href="pages/crear-cuenta.html">
                <button class="boton">
                    <span>Crea una cuenta</span>
                </button>
            </a>
        </section>

        <section class="seccion-login">
            <h2 class="title">Iniciar Sesión</h2>
            <div class="grupo-botones">
                <a href="pages/iniciar-sesion.html">
                    <button class="boton">
                        <span>Iniciar Sesión</span>
                    </button>
                </a>
                <button class="boton">
                    <span>Continuar con Google</span>
                    <img src="assets/img/logo-google.png" alt="Google" class="icono-boton">
                </button>
            </div>
        </section>

        <div class="separador">
            <span>o</span>
        </div>

        <footer class="legal">
            <p>
                Al hacer clic en continuar, aceptas nuestros
                <a href="#">Términos de servicio</a> y
                <a href="#">Política de privacidad</a>
            </p>
        </footer>
    </main>

</body>

</html>
