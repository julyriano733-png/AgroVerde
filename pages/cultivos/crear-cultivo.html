<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo Cultivo - Agro Verde</title>

  <!-- Bootstrap -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- Estilos propios -->
  <link rel="stylesheet" href="/assets/css/cultivos/crear-cultivo.css">
</head>
<body>

  <main class="pantalla container px-3 py-3">

    <!-- Encabezado -->
    <header class="d-flex align-items-center justify-content-between mb-3">
      <div class="d-flex align-items-center gap-3">
        <a href="index.html" class="btn-volver" aria-label="Volver">&#8592;</a>
        <h1 class="titulo">Nuevo Cultivo</h1>
      </div>
      <img src="/assets/img/agro-verde-con-texto.png" alt="Agro Verde" class="logo">
    </header>

    <form id="formCultivo">

      <!-- Nombre -->
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre del cultivo</label>
        <input type="text" id="nombre" class="form-control campo" placeholder="Ej. Café Castillo">
      </div>

      <!-- Tipo -->
      <div class="mb-3">
        <label for="tipo" class="form-label">Tipo de cultivo</label>
        <select id="tipo" class="form-select campo">
          <option value="" selected disabled>Seleccionar tipo</option>
          <option value="cafe">Café</option>
          <option value="maiz">Maíz</option>
          <option value="platano">Plátano</option>
          <option value="yuca">Yuca</option>
        </select>
      </div>

      <!-- Fecha -->
      <div class="mb-3">
        <label for="fecha" class="form-label">Fecha de cultivos</label>
        <input type="text" id="fecha" class="form-control campo" placeholder="DD/MM/AAAA">
      </div>

      <!-- Área -->
      <div class="mb-3">
        <label for="area" class="form-label">Área sembrada (ha)</label>
        <input type="number" id="area" class="form-control campo" placeholder="Ej. 2.5" step="0.1" min="0">
      </div>

      <!-- Semilla -->
      <div class="mb-3">
        <label for="semilla" class="form-label">Selección de semilla</label>
        <select id="semilla" class="form-select campo">
          <option value="" selected disabled>Seleccionar semilla</option>
          <option value="1">Semilla certificada</option>
          <option value="2">Semilla criolla</option>
        </select>
      </div>

     <!-- Terreno -->
<div class="mb-3">
  <span class="form-label d-block">Seleccionar terreno</span>

  <details class="terreno-desplegable">
    <summary class="campo campo-terreno">
      <span class="txt-vacio">Seleccione</span>
      <span class="txt-valor txt-t1">Terreno 1</span>
      <span class="txt-valor txt-t2">Terreno de Café</span>
      <span class="txt-valor txt-t3">Terreno Loma</span>
    </summary>

    <ul class="lista-terrenos list-unstyled mt-2 mb-0">
      <li>
        <input type="radio" name="terreno" id="t1" value="terreno1" class="opcion-oculta">
        <label for="t1" class="terreno-item">Terreno 1</label>
      </li>
      <li>
        <input type="radio" name="terreno" id="t2" value="terreno-cafe" class="opcion-oculta">
        <label for="t2" class="terreno-item">Terreno de Café</label>
      </li>
      <li>
        <input type="radio" name="terreno" id="t3" value="terreno-loma" class="opcion-oculta">
        <label for="t3" class="terreno-item">Terreno Loma</label>
      </li>
    </ul>
  </details>
</div>

      <!-- Cultivos recomendados -->
      <p class="form-label mb-2">Cultivos recomendados</p>
      <div class="row g-2 mb-3">
        <div class="col-4">
          <div class="card-reco">
            <span class="punto"></span>
            <strong class="nombre-reco">Maíz</strong>
            <small class="compat">94% compatibilidad</small>
          </div>
        </div>
        <div class="col-4">
          <div class="card-reco">
            <span class="punto"></span>
            <strong class="nombre-reco">Maíz</strong>
            <small class="compat">94% compatibilidad</small>
          </div>
        </div>
        <div class="col-4">
          <div class="card-reco">
            <span class="punto"></span>
            <strong class="nombre-reco">Maíz</strong>
            <small class="compat">94% compatibilidad</small>
          </div>
        </div>
      </div>

      <!-- Notas -->
      <div class="mb-4">
        <label for="notas" class="form-label">Notas (opcional)</label>
        <textarea id="notas" class="form-control campo" rows="4" placeholder="Observaciones adicionales..."></textarea>
      </div>

      <!-- Botón -->
      <button type="submit" class="btn btn-guardar w-100">Guardar cultivo</button>

    </form>
  </main>

  <script>
    // Al elegir un terreno de la lista, lo muestro en el campo
    const items = document.querySelectorAll('.terreno-item');
    const campoTerreno = document.getElementById('terrenoSeleccionado');

    items.forEach(function (item) {
      item.addEventListener('click', function () {
        items.forEach(i => i.classList.remove('activo'));
        item.classList.add('activo');
        campoTerreno.textContent = item.textContent;
        campoTerreno.classList.add('con-valor');
      });
    });
  </script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
