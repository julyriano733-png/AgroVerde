<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Día de cosecha estimado - Agro Verde</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/css/cultivos/dia-cosecha.css">
</head>

<body class="container">

    <!-- Encabezado -->
    <div class="d-flex justify-content-between align-items-center my-3">
        <h5 class="mb-0 titulo">Día de cosecha estimado</h5>
        <img src="/assets/img/agro-verde-con-texto.png" alt="Agro Verde" class="logo">
    </div>

    <!-- Tarjeta de cosecha -->
    <div class="card tarjeta-cosecha mb-4">
        <h6 class="nombre-lote">Maíz - Lote 3</h6>
        <p class="fecha-siembra">Sembrado: 12 Ene 2026</p>

        <h2 class="fecha-cosecha">18 Mayo 2026</h2>
        <p class="texto-cosecha">Fecha estimada de cosecha</p>

        <div class="progress barra-avance" role="progressbar" aria-label="Avance del cultivo" aria-valuenow="68" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-bar barra-relleno"></div>
        </div>
        <p class="dia-actual mb-0">Día 82 de 120</p>
    </div>

    <!-- Factores considerados -->
    <div class="card tarjeta-factores mb-4">
        <h6 class="factores-titulo">Factores considerados</h6>

        <div class="d-flex align-items-center gap-3 factor">
            <span class="punto punto-verde"></span>
            <span>Temperatura y humedad promedio</span>
        </div>

        <div class="d-flex align-items-center gap-3 factor">
            <span class="punto punto-azul"></span>
            <span>Variedad de semilla sembrada</span>
        </div>

        <div class="d-flex align-items-center gap-3 factor">
            <span class="punto punto-rojo"></span>
            <span>Historial climático de la zona</span>
        </div>
    </div>

    <!-- NAVEGACIÓN INFERIOR FIJA -->
    <div class="nav-inferior">
        <a href="inicio.html" class="item"><i class="bi bi-house-door"></i>Inicio</a>
        <a href="cultivos.html" class="item activo"><i class="bi bi-flower2"></i>Cultivos</a>
        <a href="clima.html" class="item"><i class="bi bi-cloud-sun"></i>Clima</a>
        <a href="insumos.html" class="item"><i class="bi bi-box-seam"></i>Insumos</a>
        <a href="perfil.html" class="item"><i class="bi bi-person"></i>Perfil</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
