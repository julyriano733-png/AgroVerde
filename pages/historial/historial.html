<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial - Agro Verde</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- Íconos de Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <!-- Estilos globales y específicos de Historial -->
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/historial/historial.css">
</head>

<body>

  <!-- Pantalla principal fluida -->
  <main class="pantalla container-fluid">

    <!-- Encabezado con botón regresar, título y logo -->
    <header class="d-flex justify-content-between align-items-center mb-4">
      <div class="d-flex align-items-center gap-3">
        <a href="../inicio/inicio.html"
          class="boton_atras text-white text-decoration-none d-flex align-items-center justify-content-center"
          aria-label="Volver">
          <i class="bi bi-chevron-left fs-5"></i>
        </a>
        <h4 class="m-0 text-white fw-bold">Historial</h4>
      </div>
      <img src="../../assets/img/agro-verde-sin-texto.png" alt="Agro Verde" class="app-logo-mini">
    </header>

    <!-- Filtros por categoría (el JS lee el data-filtro de cada botón) -->
    <div class="d-flex gap-2 mb-4 overflow-auto pb-1">
      <button type="button" data-filtro="todos" class="btn_nuevo border-0 py-1 px-3">Todos</button>
      <button type="button" data-filtro="cultivos" class="boton_acceso border-0 py-1 px-3 rounded-4">Cultivos</button>
      <button type="button" data-filtro="insumos" class="boton_acceso border-0 py-1 px-3 rounded-4">Insumos</button>
      <button type="button" data-filtro="inventario" class="boton_acceso border-0 py-1 px-3 rounded-4">Inventario</button>
    </div>

    <!-- Lista del historial agrupada por días -->
    <div class="row g-4 mb-4">

      <!-- Columna izquierda: Hoy (el JS dibuja aquí los eventos de hoy) -->
      <section class="col-12 col-lg-6">
        <p class="mb-3 text-white fw-bold small">Hoy</p>
        <div class="d-flex flex-column gap-3" id="eventos-hoy"></div>
      </section>

      <!-- Columna derecha: Ayer (el JS dibuja aquí los eventos de días anteriores) -->
      <section class="col-12 col-lg-6">
        <p class="mb-3 text-white fw-bold small">Ayer</p>
        <div class="d-flex flex-column gap-3" id="eventos-ayer"></div>
      </section>

    </div>

  </main>

  <!-- Barra de navegación inferior fija -->
  <nav class="navegacion_inferior d-flex justify-content-between">
    <a href="../inicio/inicio.html" class="text-center small"><i class="bi bi-house-door d-block"></i>Inicio</a>
    <a href="../cultivos/cultivos.html" class="text-center small"><i class="bi bi-flower1 d-block"></i>Cultivos</a>
    <a href="../clima/clima.html" class="text-center small"><i class="bi bi-cloud-sun d-block"></i>Clima</a>
    <a href="../insumos/insumos.html" class="text-center small"><i class="bi bi-box-seam d-block"></i>Insumos</a>
    <a href="../perfil/perfil.html" class="text-center small"><i class="bi bi-person-circle d-block"></i>Perfil</a>
  </nav>

  <!-- Script de Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <!-- Nuestro JavaScript: comun.js SIEMPRE primero -->
  <script src="../../assets/js/comun.js"></script>
  <script src="../../assets/js/historial/historial.js"></script>
</body>

</html>
