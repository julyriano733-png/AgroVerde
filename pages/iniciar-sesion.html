<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Agro Verde</title>
  <link rel="stylesheet" href="../assets/css/iniciar-sesion.css">
</head>

<body>
  <main class="tarjeta_inicio">
    <header class="encabezado">
      <h1>Iniciar sesión</h1>
      <img src="../assets/img/agro-verde-con-texto.png" width="90" height="80" alt="Logo de Agro Verde">
      <p>Ingresa tus datos para continuar</p>
    </header>

    <form class="formulario_login">

      <label class="correo">Correo electrónico
        <input type="email" id="email" placeholder="Ingrese su correo" required>
      </label>

      <label class="contraseña">Contraseña
        <input type="password" id="password" placeholder="Ingrese su contraseña" required>
      </label>

      <p class="olvido_contraseña">
        <a href="../pages/recuperar-contrasena.html">¿Olvidaste tu contraseña?</a>
      </p>


      <button type="submit" class="boton_iniciar_sesion">Iniciar sesión</button>

    </form>


    <p class="registro">¿No tienes cuenta?
      <a href="../pages/crear-cuenta.html" class="iniciar_sesion">Regístrate</a>
    </p>



  </main>
</body>

</html>
