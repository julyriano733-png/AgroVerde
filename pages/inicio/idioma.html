<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idioma y regionalización - Agro Verde</title>
    <link rel="stylesheet" href="../../assets/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/inicio/configuracion.css">
    <link rel="stylesheet" href="../../assets/css/inicio/preferencias.css">
  <link rel="stylesheet" href="../../assets/css/logo.css">
</head>

<body>
  <img src="../../assets/img/agro-verde-logo.png" alt="Agro Verde" class="logo-app">
    <main class="pantalla container-fluid">
        <!-- Encabezado -->
        <header class="app-header">
            <div class="app-header__left">
                <a href="configuracion.html" class="btn-back" aria-label="Volver"><i class="bi bi-arrow-left"></i></a>
                <h4 class="m-0 fw-bold">Idioma y regionalización</h4>
            </div>
        </header>

        <div class="mx-auto" style="max-width: 760px;">
            <form id="formIdioma">
                <p class="mb-2 texto_subtitulo small text-uppercase">Idioma</p>
                <div class="d-flex flex-column gap-2 mb-4">
                <label class="tarjeta_con_borde p-3 rounded-4 d-flex justify-content-between align-items-center" style="cursor: pointer;">
                    <div>
                        <span class="texto_blanco d-block">Español (Colombia)</span>
                        <span class="small texto_gris">Idioma principal de la aplicación</span>
                    </div>
                    <input type="radio" name="idioma" value="Español (CO)" class="form-check-input m-0" checked>
                </label>
                <label class="tarjeta_con_borde p-3 rounded-4 d-flex justify-content-between align-items-center" style="cursor: pointer;">
                    <div>
                        <span class="texto_blanco d-block">English (United States)</span>
                        <span class="small texto_gris">Interface language in English</span>
                    </div>
                    <input type="radio" name="idioma" value="English (US)" class="form-check-input m-0">
                </label>
                <label class="tarjeta_con_borde p-3 rounded-4 d-flex justify-content-between align-items-center" style="cursor: pointer;">
                    <div>
                        <span class="texto_blanco d-block">Português (Brasil)</span>
                        <span class="small texto_gris">Idioma da interface em português</span>
                    </div>
                    <input type="radio" name="idioma" value="Português (BR)" class="form-check-input m-0">
                </label>
                </div>

                <p class="mb-2 texto_subtitulo small text-uppercase">Región</p>
                <label for="zonaHoraria" class="agro-label">Zona horaria</label>
                <select id="zonaHoraria" class="agro-select">
                    <option value="America/Bogota">Bogotá (GMT-5)</option>
                    <option value="America/Mexico_City">Ciudad de México (GMT-6)</option>
                    <option value="America/Lima">Lima (GMT-5)</option>
                    <option value="America/Sao_Paulo">São Paulo (GMT-3)</option>
                </select>
                <label for="formatoFecha" class="agro-label">Formato de fecha</label>
                <select id="formatoFecha" class="agro-select">
                    <option value="dd/mm/aaaa">DD/MM/AAAA (25/11/2026)</option>
                    <option value="mm/dd/aaaa">MM/DD/AAAA (11/25/2026)</option>
                    <option value="aaaa-mm-dd">AAAA-MM-DD (2026-11-25)</option>
                </select>
                <label for="moneda" class="agro-label">Moneda</label>
                <select id="moneda" class="agro-select">
                    <option value="COP">Peso colombiano (COP $)</option>
                    <option value="USD">Dólar (USD $)</option>
                    <option value="BRL">Real (BRL R$)</option>
                </select>

                <p class="small texto_gris">Por ahora la aplicación solo está traducida al español: el idioma elegido se guarda para cuando estén las traducciones.</p>
                <button type="submit" class="btn-agro-primary">Guardar cambios</button>
            </form>
        </div>
    </main>

    <nav class="navegacion_inferior d-flex justify-content-between">
        <a href="../inicio/inicio.html" class="text-center small"><i class="bi bi-house-door d-block"></i>Inicio</a>
        <a href="../cultivos/cultivos.html" class="text-center small"><i class="bi bi-flower1 d-block"></i>Cultivos</a>
        <a href="../clima/clima.html" class="text-center small"><i class="bi bi-cloud-sun d-block"></i>Clima</a>
        <a href="../insumos/insumos.html" class="text-center small"><i class="bi bi-box-seam d-block"></i>Insumos</a>
        <a href="../perfil/perfil.html" class="text-center small"><i class="bi bi-person-circle d-block"></i>Perfil</a>
    </nav>

    <script src="../../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/comun.js"></script>
    <script src="../../assets/js/permisos.js"></script>
    <script src="../../assets/js/inicio/preferencias.js"></script>
    <script src="../../assets/js/confirmacion.js"></script>
  <script src="../../assets/js/conexion.js"></script>
  <script src="../../assets/js/logo.js"></script>
</body>

</html>
