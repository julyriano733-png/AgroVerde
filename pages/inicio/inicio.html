<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finca El Manantial - Agro Verde</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <!-- Estilos globales y específicos de inicio -->
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/inicio/inicio-pantalla.css">

  <!-- Pantalla principal fluida -->
  <main class="pantalla container-fluid">

    <!-- Encabezado con logo, título y botones de notificaciones y ajustes -->
    <header class="d-flex justify-content-between align-items-center mb-4">
      <div class="d-flex align-items-center gap-3">
        <img src="../../assets/img/agro-verde-sin-texto.png" alt="Agro Verde" class="app-logo-mini">
        <div>
          <h5 class="m-0 fw-bold">Finca El Manantial</h5>
          <!-- el JS escribe aquí "Hola, July Riaño (Administrador)" -->
          <p id="saludo" class="m-0 small texto_gris"></p>
        </div>
      </div>
      <div class="d-flex gap-3">
        <a href="notificaciones-general.html" class="position-relative text-white text-decoration-none" aria-label="Notificaciones">
          <i class="bi bi-bell fs-5"></i>
          <!-- el JS escribe aquí cuántas notificaciones faltan por leer (si no hay ninguna, queda escondido) -->
          <span id="contador-notificaciones" class="badge rounded-pill bg-danger position-absolute top-0 start-100 translate-middle d-none"></span>
        </a>
        <a href="configuracion.html" class="text-white text-decoration-none" aria-label="Configuración">
          <i class="bi bi-gear fs-5"></i>
        </a>
      </div>
    </header>

    <!-- Tarjeta clima actual -->
    <a href="../clima/clima.html" class="tarjeta p-3 rounded-4 d-flex justify-content-between align-items-center mb-3 text-decoration-none">
      <div>
        <p class="mb-1">Clima actual</p>
        <h3 class="m-0">24°C - Soleado</h3>
      </div>
      <div class="punto_verde"></div>
    </a>

    <!-- Tarjetas de resumen rápido -->
    <div class="row g-2 mb-3">
      <div class="col-6 col-md-3">
        <a href="../cultivos/cultivos.html" class="tarjeta p-3 rounded-4 text-decoration-none d-block">
          <p class="mb-1 small">Cultivos activos</p>
          <div class="d-flex justify-content-between align-items-center">
            <h4 class="m-0">128</h4>
            <div class="punto_verde_pequeno"></div>
          </div>
        </a>
      </div>
      <div class="col-6 col-md-3">
        <a href="../plagas/plagas.html" class="tarjeta p-3 rounded-4 text-decoration-none d-block">
          <p class="mb-1 small">Alertas plagas</p>
          <div class="d-flex justify-content-between align-items-center">
            <h4 class="m-0">3</h4>
            <div class="punto_verde_pequeno"></div>
          </div>
        </a>
      </div>
      <div class="col-6 col-md-3">
        <a href="../clima/clima.html" class="tarjeta p-3 rounded-4 text-decoration-none d-block">
          <p class="mb-1 small">Humedad</p>
          <div class="d-flex justify-content-between align-items-center">
            <h4 class="m-0">68%</h4>
            <div class="punto_verde_pequeno"></div>
          </div>
        </a>
      </div>
      <div class="col-6 col-md-3">
        <a href="../clima/riesgo-plagas-clima.html" class="tarjeta p-3 rounded-4 text-decoration-none d-block">
          <p class="mb-1 small">Riesgo hoy</p>
          <div class="d-flex justify-content-between align-items-center">
            <h4 class="m-0">62%</h4>
            <div class="punto_verde_pequeno"></div>
          </div>
        </a>
      </div>
    </div>

      <div class="col-12 col-lg-7">
        <p class="mb-2 fw-semibold">Accesos rápidos</p>
        <div class="row g-2 mb-2">
          <div class="col-4">
            <a href="../plagas/plagas.html" class="boton_acceso text-center py-3 rounded-4 text-decoration-none d-block">Plagas</a>
          </div>
          <div class="col-4">
            <a href="../propiedad/ver-propiedad.html" class="boton_acceso text-center py-3 rounded-4 text-decoration-none d-block">Propiedades</a>
          </div>
          <div class="col-4">
            <a href="../reportes/reportes.html" class="boton_acceso text-center py-3 rounded-4 text-decoration-none d-block">Reportes</a>
          </div>
        </div>
        <div class="row g-2 mb-3">
          <div class="col-4">
            <a href="../terreno/terreno.html" class="boton_acceso text-center py-3 rounded-4 text-decoration-none d-block">Terrenos</a>

          <div class="col-4">

          </div>

            <a href="../insumos/proveedores-insumos.html" class="boton_acceso text-center py-3 rounded-4 text-decoration-none d-block">Proveedores</a>

        </div>

        <div class="contenedor_historial" id="historial-reciente"></div>
      </div>

  <nav class="navegacion_inferior d-flex justify-content-between">
    <a href="inicio.html" class="text-center small active"><i class="bi bi-house-door d-block"></i>Inicio</a>
    <a href="../cultivos/cultivos.html" class="text-center small"><i class="bi bi-flower1 d-block"></i>Cultivos</a>
    <a href="../clima/clima.html" class="text-center small"><i class="bi bi-cloud-sun d-block"></i>Clima</a>
    <a href="../insumos/insumos.html" class="text-center small"><i class="bi bi-box-seam d-block"></i>Insumos</a>
    <a href="../perfil/perfil.html" class="text-center small"><i class="bi bi-person-circle d-block"></i>Perfil</a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Nuestro JavaScript: comun.js SIEMPRE primero -->
  <script src="../../assets/js/comun.js"></script>
  <script src="../../assets/js/inicio/inicio.js"></script>
