<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificaciones - Agro Verde</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- Íconos de Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <!-- Estilos globales y específicos de notificaciones -->
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/inicio/notificaciones-general.css">
</head>

<body>

  <main class="pantalla container-fluid">

    <!-- Encabezado con botón regresar, título y cuántas faltan por leer -->
    <header class="d-flex justify-content-between align-items-center mb-4">
      <div class="d-flex align-items-center gap-3">
        <a href="inicio.html" class="btn-back" aria-label="Volver">
          <i class="bi bi-arrow-left"></i>
        </a>
        <div>
          <h4 class="m-0 text-white fw-bold">Notificaciones</h4>
          <!-- el JS escribe aquí "Tienes 3 sin leer" o "Estás al día" -->
          <p id="resumen" class="m-0 small texto_gris"></p>
        </div>
      </div>
      <img src="../../assets/img/agro-verde-sin-texto.png" alt="Agro Verde" class="app-logo-mini">
    </header>

    <button type="button" id="marcar-todas" class="boton_marcar py-2 px-3 rounded-4 mb-3">
      <i class="bi bi-check2-all me-2"></i>Marcar todas como leídas
    </button>

    <!-- el JS dibuja aquí las tarjetas de las notificaciones -->
    <div id="lista-notificaciones" class="d-flex flex-column gap-2"></div>

  </main>

  <!-- Barra de navegación inferior fija -->
  <nav class="navegacion_inferior d-flex justify-content-between">
    <a href="inicio.html" class="text-center small"><i class="bi bi-house-door d-block"></i>Inicio</a>
    <a href="../cultivos/cultivos.html" class="text-center small"><i class="bi bi-flower1 d-block"></i>Cultivos</a>
    <a href="../clima/clima.html" class="text-center small"><i class="bi bi-cloud-sun d-block"></i>Clima</a>
    <a href="../insumos/insumos.html" class="text-center small"><i class="bi bi-box-seam d-block"></i>Insumos</a>
    <a href="../perfil/perfil.html" class="text-center small"><i class="bi bi-person-circle d-block"></i>Perfil</a>
  </nav>

  <!-- Script de Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <!-- Nuestro JavaScript: comun.js SIEMPRE primero -->
  <script src="../../assets/js/comun.js"></script>
  <script src="../../assets/js/inicio/notificaciones-general.js"></script>

</html>
