<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración</title>
  
  <!-- traemos bootstrap para k se vea bien sin complicarme tanto -->

  <!-- iconos de bootstrap para las flechas y botones de la configuracion -->

  <!-- estilos del css de configuracion -->

  <!-- este div es la pantalla principal para k no se descuadre en cel -->

    <div class="d-flex flex-column gap-2 mb-4">

        </div>
      </a>

      <a href="alertas_config.html" class="tarjeta_con_borde p-3 rounded-4 d-flex justify-content-between align-items-center text-decoration-none">

        <i class="bi bi-chevron-right icono_verde"></i>
      </a>

    <div class="tarjeta p-0 rounded-4 mb-4 overflow-hidden">

      <a href="soporte.html" class="item_opcion d-flex justify-content-between align-items-center p-3 text-decoration-none border-bottom-subtil">
        <span class="texto_blanco">Ayuda y soporte</span>
        <i class="bi bi-chevron-right icono_verde"></i>
