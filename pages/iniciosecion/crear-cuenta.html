<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta - AgroVerde</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/iniciosecion/crear-cuenta.css">
</head>

<body>
  <main class="tarjeta_cuenta">

    <header class="encabezado">
      <h1>Crear Cuenta</h1>
      <img src="../../assets/img/agro-verde-con-texto.png" width="90" height="80" alt="Logo AgroVerde">
      <p>Ingresa tus datos para continuar</p>
    </header>

    <form class="formulario_cuenta" action="inicio.html">

      <label class="usuario">Nombre de usuario
        <input type="text" id="usuario" placeholder="Tu nombre" required>
      </label>

      <label class="correo">Correo electrónico
        <input type="email" id="correo" placeholder="tu@correo.com" required>
      </label>

      <label class="contraseña">Contraseña
        <input type="password" id="contrasena" placeholder="••••••••" required>
      </label>

      <label class="rol">Rol
        <select id="rol" required>
          <option value="" disabled selected>Selecciona tu rol</option>
          <option value="Agricultor">Agricultor</option>
          <option value="Administrador">Administrador</option>
          <option value="Trabajador">Trabajador</option>
        </select>
      </label>

      <button type="submit" class="boton_crear_cuenta">Crear cuenta</button>

    </form>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
