<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Costos por siembra - Agro Verde</title>
    <link rel="stylesheet" href="../../assets/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/insumos/insumos.css">
  <link rel="stylesheet" href="../../assets/css/logo.css">
</head>

<body>
  <img src="../../assets/img/agro-verde-logo.png" alt="Agro Verde" class="logo-app">
    <main class="pantalla container-fluid">
        <!-- Encabezado -->
        <header class="app-header">
            <div class="app-header__left">
                <a href="opciones-insumo.html" class="btn-back" aria-label="Volver"><i class="bi bi-arrow-left"></i></a>
                <h3 class="m-0 fw-bold">Costos por siembra</h3>
            </div>
        </header>

        <div class="contenido-insumos">
            <p class="titulo-seccion">Seleccionar siembra</p>
            <div id="pillsSiembra" class="pastillas pastillas--tres">
                <input type="radio" name="siembra" id="cs-0" checked>
                <label for="cs-0">Maíz - Lote 1</label>
                <input type="radio" name="siembra" id="cs-1">
                <label for="cs-1">Café - Lote 2</label>
                <input type="radio" name="siembra" id="cs-2">
                <label for="cs-2">Frijol - Lote 3</label>
            </div>

            <div class="tarjeta-resumen mb-3">
                <p class="titulo-seccion mb-1">Costo total de insumos</p>
                <div class="monto-total" id="montoTotal">$258.000</div>
                <span class="texto_gris small d-block mb-3" id="cantidadRegistros">4 insumos registrados</span>
                <hr class="m-0">
            </div>

            <div id="listaPrincipal" class="lista-insumos d-flex flex-column gap-2 mb-3">
                <div class="tarjeta p-3 rounded-4 d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-3">
                        <span class="punto-insumo punto-insumo--verde"></span>
                        <div>
                        <strong class="d-block">Fertilizante NPK</strong>
                        <span class="texto_gris small">4 sacos</span>
                        </div>
                    </div>
                    <span class="precio">$120.000</span>
                </div>
                <div class="tarjeta p-3 rounded-4 d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-3">
                        <span class="punto-insumo punto-insumo--azul"></span>
                        <div>
                        <strong class="d-block">Herbicida selectivo</strong>
                        <span class="texto_gris small">3 L</span>
                        </div>
                    </div>
                    <span class="precio">$45.000</span>
                </div>
                <div class="tarjeta p-3 rounded-4 d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-3">
                        <span class="punto-insumo punto-insumo--rojo"></span>
                        <div>
                        <strong class="d-block">Fungicida orgánico</strong>
                        <span class="texto_gris small">1 und</span>
                        </div>
                    </div>
                    <span class="precio">$38.000</span>
                </div>
                <div class="tarjeta p-3 rounded-4 d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-3">
                        <span class="punto-insumo punto-insumo--verde"></span>
                        <div>
                        <strong class="d-block">Semilla de maíz</strong>
                        <span class="texto_gris small">25 kg</span>
                        </div>
                    </div>
                    <span class="precio">$55.000</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Barra de navegación inferior -->
    <nav class="navegacion_inferior d-flex justify-content-between">
        <a href="../inicio/inicio.html" class="text-center small"><i class="bi bi-house-door d-block"></i>Inicio</a>
        <a href="../cultivos/cultivos.html" class="text-center small"><i class="bi bi-flower1 d-block"></i>Cultivos</a>
        <a href="../clima/clima.html" class="text-center small"><i class="bi bi-cloud-sun d-block"></i>Clima</a>
        <a href="insumos.html" class="text-center small active"><i class="bi bi-box-seam d-block"></i>Insumos</a>
        <a href="../perfil/perfil.html" class="text-center small"><i class="bi bi-person-circle d-block"></i>Perfil</a>
    </nav>

    <script src="../../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/comun.js"></script>
    <script src="../../assets/js/permisos.js"></script>
    <script src="../../assets/js/insumos/datos-insumos.js"></script>
    <script src="../../assets/js/insumos/insumos.js"></script>
    <script src="../../assets/js/confirmacion.js"></script>
  <script src="../../assets/js/conexion.js"></script>
  <script src="../../assets/js/logo.js"></script>
</body>

</html>
