<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráfica de insumos - Agro Verde</title>
    <link rel="stylesheet" href="../../assets/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/insumos/insumos.css">
  <link rel="stylesheet" href="../../assets/css/logo.css">
</head>

<body>
  <img src="../../assets/img/agro-verde-logo.png" alt="Agro Verde" class="logo-app">
    <main class="pantalla container-fluid">
        <!-- Encabezado -->
        <header class="app-header">
            <div class="app-header__left">
                <a href="opciones-insumo.html" class="btn-back" aria-label="Volver"><i class="bi bi-arrow-left"></i></a>
                <h3 class="m-0 fw-bold">Gráfica de insumos</h3>
            </div>
        </header>

        <div class="contenido-insumos">
            <div class="tarjeta-resumen mb-3">
                <span class="texto_gris small">Uso de insumos - último mes (kg)</span>
                <div class="grafica" id="graficaBarras">
                    <div class="barra-col">
                        <div class="barra barra--verde" style="height: 55%;"></div>
                    </div>
                    <div class="barra-col">
                        <div class="barra barra--azul" style="height: 35%;"></div>
                    </div>
                    <div class="barra-col">
                        <div class="barra barra--amarillo" style="height: 70%;"></div>
                    </div>
                    <div class="barra-col">
                        <div class="barra barra--rojo" style="height: 22%;"></div>
                    </div>
                </div>
                <div class="grafica-etiquetas" id="graficaEtiquetas">
                    <span>Urea</span>
                    <span>Cobre</span>
                    <span>NPK</span>
                    <span>Cal</span>
                </div>
            </div>

            <a href="costos-por-insumo.html" class="btn-agro-primary">Ver detalle por insumo</a>
        </div>
    </main>

    <!-- Barra de navegación inferior -->
    <nav class="navegacion_inferior d-flex justify-content-between">
        <a href="../inicio/inicio.html" class="text-center small"><i class="bi bi-house-door d-block"></i>Inicio</a>
        <a href="../cultivos/cultivos.html" class="text-center small"><i class="bi bi-flower1 d-block"></i>Cultivos</a>
        <a href="../clima/clima.html" class="text-center small"><i class="bi bi-cloud-sun d-block"></i>Clima</a>
        <a href="insumos.html" class="text-center small active"><i class="bi bi-box-seam d-block"></i>Insumos</a>
        <a href="../perfil/perfil.html" class="text-center small"><i class="bi bi-person-circle d-block"></i>Perfil</a>
    </nav>

    <script src="../../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/comun.js"></script>
    <script src="../../assets/js/permisos.js"></script>
    <script src="../../assets/js/insumos/datos-insumos.js"></script>
    <script src="../../assets/js/insumos/insumos.js"></script>
    <script src="../../assets/js/confirmacion.js"></script>
  <script src="../../assets/js/conexion.js"></script>
  <script src="../../assets/js/logo.js"></script>
