<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inhabilitar insumo - Agro Verde</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Íconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Estilos globales y específicos de Insumos -->
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/insumos/insumos.css">
</head>

<body>

    <main class="pantalla container-fluid">

        <!-- Encabezado -->
        <header class="d-flex justify-content-between align-items-center mb-4">
            <div class="d-flex align-items-center gap-3">
                <a href="insumos.html"
                    class="boton_atras text-white text-decoration-none d-flex align-items-center justify-content-center"
                    aria-label="Volver">
                    <i class="bi bi-chevron-left fs-5"></i>
                </a>
                <h4 class="m-0 text-white fw-bold">Inhabilitar insumo</h4>
            </div>
            <img src="../../assets/img/agro-verde-con-texto.png" alt="Agro Verde" class="logo-header">
        </header>

        <!-- Lista de selección centrada -->
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <form action="insumos.html" method="GET">

                    <div class="d-flex flex-column gap-3 mb-4">

                        <!-- Opción 1 -->
                        <label class="tarjeta p-3 rounded-4 d-flex align-items-center gap-3 cursor-pointer">
                            <input type="radio" class="form-check-input radio_custom m-0" name="insumo"
                                value="fertilizante-npk" required>
                            <span class="punto_estado punto_verde"></span>
                            <div class="flex-grow-1">
                                <div class="fw-bold text-white">Fertilizante NPK</div>
                                <small class="texto_gris">18 sacos disponibles</small>
                            </div>
                        </label>

                        <!-- Opción 2 -->
                        <label class="tarjeta p-3 rounded-4 d-flex align-items-center gap-3 cursor-pointer">
                            <input type="radio" class="form-check-input radio_custom m-0" name="insumo"
                                value="fungicida-organico">
                            <span class="punto_estado punto_rojo"></span>
                            <div class="flex-grow-1">
                                <div class="fw-bold text-white">Fungicida orgánico</div>
                                <small class="texto_gris">3 unidades - bajo stock</small>
                            </div>
                        </label>

                        <!-- Opción 3 -->
                        <label class="tarjeta p-3 rounded-4 d-flex align-items-center gap-3 cursor-pointer">
                            <input type="radio" class="form-check-input radio_custom m-0" name="insumo"
                                value="herbicida-selectivo">
                            <span class="punto_estado punto_cyan"></span>
                            <div class="flex-grow-1">
                                <div class="fw-bold text-white">Herbicida selectivo</div>
                                <small class="texto_gris">9 litros disponibles</small>
                            </div>
                        </label>

                    </div>

                    <button type="submit" class="btn_inhabilitar_suave w-100 py-3 rounded-4 fw-semibold">
                        Inhabilitar insumo
                    </button>

                </form>

            </div>
        </div>

    </main>

    <!-- Barra de navegación inferior fija -->
    <nav class="navegacion_inferior d-flex justify-content-between">
        <a href="../inicio/inicio.html" class="text-center small"><i class="bi bi-house-door d-block"></i>Inicio</a>
        <a href="../cultivos/cultivos.html" class="text-center small"><i class="bi bi-flower1 d-block"></i>Cultivos</a>
        <a href="../clima/clima.html" class="text-center small"><i class="bi bi-cloud-sun d-block"></i>Clima</a>
        <a href="insumos.html" class="text-center small active"><i class="bi bi-box-seam d-block"></i>Insumos</a>
        <a href="../perfil/perfil.html" class="text-center small"><i class="bi bi-person-circle d-block"></i>Perfil</a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
