<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uso de insumo - Agro Verde</title>
    <link rel="stylesheet" href="../../assets/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/insumos/insumos.css">
  <link rel="stylesheet" href="../../assets/css/logo.css">
</head>

<body>
  <img src="../../assets/img/agro-verde-logo.png" alt="Agro Verde" class="logo-app">
    <main class="pantalla container-fluid">
        <!-- Encabezado -->
        <header class="app-header">
            <div class="app-header__left">
                <a href="insumos.html" class="btn-back" aria-label="Volver"><i class="bi bi-arrow-left"></i></a>
                <h3 class="m-0 fw-bold">Uso de insumo</h3>
            </div>
        </header>

        <div class="contenido-insumos">
            <form id="formUsoInsumo" action="insumos.html">
                <input type="hidden" name="mensaje" value="guardado">
                <label for="insumo" class="agro-label">Insumo a usar</label>
                <select id="insumo" name="insumo" class="agro-select">
                    <option value="" selected disabled>Seleccionar insumo</option>
                    <option>Fertilizante NPK</option>
                    <option>Herbicida selectivo</option>
                    <option>Semilla de maíz</option>
                    <option>Fungicida orgánico</option>
                </select>
                <label for="cultivo" class="agro-label">Selecciona cultivo</label>
                <select id="cultivo" name="cultivo" class="agro-select">
                    <option value="" selected disabled>Seleccionar cultivo</option>
                    <option>Maíz - lote 1</option>
                    <option>Café - lote 3</option>
                    <option>Frijol - lote 4</option>
                    <option>Tomate - lote 5</option>
                </select>
                <label for="cantidad" class="agro-label">Cantidad usada</label>
                <input type="number" id="cantidad" name="cantidad" class="agro-input" placeholder="Ej. 10">
                <label for="unidad" class="agro-label">Unidad de medida</label>
                <input type="text" id="unidad" name="unidad" class="agro-input" placeholder="Se llena al elegir el insumo" readonly>
                <label for="fecha" class="agro-label">Fecha de uso</label>
                <input type="date" id="fecha" name="fecha" class="agro-input">

                <label for="observaciones" class="agro-label">Observaciones</label>
                <textarea id="observaciones" name="observaciones" class="agro-textarea" rows="3" placeholder="Ej. Aplicación foliar"></textarea>

                <button type="submit" class="btn-agro-primary mb-2">Registrar uso</button>
                <a href="codigo-barras.html" class="btn-agro-outline"><i class="bi bi-upc-scan"></i> Buscar por código de barras</a>
            </form>
        </div>
    </main>

    <!-- Barra de navegación inferior -->
    <nav class="navegacion_inferior d-flex justify-content-between">
        <a href="../inicio/inicio.html" class="text-center small"><i class="bi bi-house-door d-block"></i>Inicio</a>
        <a href="../cultivos/cultivos.html" class="text-center small"><i class="bi bi-flower1 d-block"></i>Cultivos</a>
        <a href="../clima/clima.html" class="text-center small"><i class="bi bi-cloud-sun d-block"></i>Clima</a>
        <a href="insumos.html" class="text-center small active"><i class="bi bi-box-seam d-block"></i>Insumos</a>
        <a href="../perfil/perfil.html" class="text-center small"><i class="bi bi-person-circle d-block"></i>Perfil</a>
    </nav>

    <script src="../../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/comun.js"></script>
    <script src="../../assets/js/permisos.js"></script>
    <script src="../../assets/js/insumos/datos-insumos.js"></script>
    <script src="../../assets/js/insumos/insumos.js"></script>
    <script src="../../assets/js/confirmacion.js"></script>
  <script src="../../assets/js/conexion.js"></script>
  <script src="../../assets/js/logo.js"></script>
</body>

</html>
