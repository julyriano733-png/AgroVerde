<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar perfil - Agro Verde</title>
    <link rel="stylesheet" href="../../assets/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/inicio/configuracion.css">
    <link rel="stylesheet" href="../../assets/css/inicio/preferencias.css">
    <link rel="stylesheet" href="../../assets/css/perfil/perfil.css">
  <link rel="stylesheet" href="../../assets/css/logo.css">
</head>

<body>
  <img src="../../assets/img/agro-verde-logo.png" alt="Agro Verde" class="logo-app">
    <main class="pantalla container-fluid">
        <!-- Encabezado -->
        <header class="app-header">
            <div class="app-header__left">
                <a href="perfil.html" class="btn-back" aria-label="Volver"><i class="bi bi-arrow-left"></i></a>
                <h4 class="m-0 fw-bold">Editar perfil</h4>
            </div>
        </header>

        <div class="mx-auto" style="max-width: 760px;">
            <form id="formEditarPerfil">
                <div class="avatar-perfil mx-auto mb-4" id="avatarEditar">HM</div>

                <p class="mb-2 texto_subtitulo small text-uppercase">Datos de la cuenta</p>
                <label for="nombrePerfil" class="agro-label">Nombre completo</label>
                <input type="text" id="nombrePerfil" class="agro-input" placeholder="Tu nombre">

                <label for="correoPerfil" class="agro-label">Correo electrónico</label>
                <input type="email" id="correoPerfil" class="agro-input" placeholder="tu@correo.com">

                <label for="rolPerfil" class="agro-label">Rol</label>
                <input type="text" id="rolPerfil" class="agro-input" disabled>

                <p class="mb-2 mt-2 texto_subtitulo small text-uppercase">Cambiar contraseña (opcional)</p>
                <label for="contrasenaActual" class="agro-label">Contraseña actual</label>
                <input type="password" id="contrasenaActual" class="agro-input" placeholder="••••••••">

                <label for="contrasenaNueva" class="agro-label">Contraseña nueva</label>
                <input type="password" id="contrasenaNueva" class="agro-input" placeholder="Mínimo 6 caracteres">

                <label for="contrasenaRepetir" class="agro-label">Repite la contraseña nueva</label>
                <input type="password" id="contrasenaRepetir" class="agro-input" placeholder="••••••••">

                <button type="submit" class="btn-agro-primary mt-2">Guardar cambios</button>
            </form>
        </div>
    </main>

    <nav class="navegacion_inferior d-flex justify-content-between">
        <a href="../inicio/inicio.html" class="text-center small"><i class="bi bi-house-door d-block"></i>Inicio</a>
        <a href="../cultivos/cultivos.html" class="text-center small"><i class="bi bi-flower1 d-block"></i>Cultivos</a>
        <a href="../clima/clima.html" class="text-center small"><i class="bi bi-cloud-sun d-block"></i>Clima</a>
        <a href="../insumos/insumos.html" class="text-center small"><i class="bi bi-box-seam d-block"></i>Insumos</a>
        <a href="../perfil/perfil.html" class="text-center small"><i class="bi bi-person-circle d-block"></i>Perfil</a>
    </nav>

    <script src="../../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/comun.js"></script>
    <script src="../../assets/js/perfil/editar-perfil.js"></script>
    <script src="../../assets/js/confirmacion.js"></script>
  <script src="../../assets/js/conexion.js"></script>
  <script src="../../assets/js/logo.js"></script>
</body>

</html>
