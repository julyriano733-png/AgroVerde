<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil - Agro Verde</title>
  
  <!-- traemos bootstrap para k se vea bien sin complicarme tanto -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- iconos de bootstrap para la interfaz y el menu de abajo -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <!-- estilos del css de perfil -->
  <link rel="stylesheet" href="../../assets/css/inicio/perfil.css">
</head>
<body>

  <!-- este div es la pantalla principal k en pc se estira a lo ancho para k no quede apretado -->
  <div class="pantalla container-fluid">

    <!-- parte de arriba con el titulo perfil y el logo oficial de agro verde -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="m-0 text-white fw-bold">Perfil</h4>
      <!-- logo oficial de agro verde cargado desde la carpeta de imagenes -->
      <div class="logo-agroverde">
        <img src="../../assets/img/agro-verde-con-texto.png" alt="Logo Agro Verde" class="img-fluid" style="max-width: 100px;">
      </div>
    </div>

    <!-- estructura en columnas para aprovechar la pantalla ancha del pc -->
    <div class="row g-4 mb-4">
      
      <!-- columna izquierda: tarjeta principal del usuario y botones de accion -->
      <div class="col-12 col-lg-6">
        
        <!-- tarjeta principal con foto de perfil, nombre y cargo -->
        <div class="tarjeta p-4 rounded-4 text-center mb-3">
          <!-- avatar o foto de perfil redonda -->
          <div class="punto_verde mx-auto mb-3" style="width: 70px; height: 70px;"></div>
          <h5 class="m-0 text-white fw-bold mb-1">Helian Moreno</h5>
          <p class="m-0 small texto_gris">Agrónomo - Finca El Manantial</p>
        </div>

        <!-- boton de configuracion k lleva a ajustes -->
        <a href="../iniciosecion/configuracion.html" class="boton_acceso text-center py-3 rounded-4 text-decoration-none d-block mb-3">
          Configuración
        </a>

        <!-- boton rojo para cerrar la sesion actual -->
        <a href="../iniciosecion/iniciar-sesion.html" class="btn_inhabilitar d-block text-center text-decoration-none py-3 rounded-4">
          Cerrar sesión
        </a>

      </div>

      <!-- columna derecha: lista de usuarios registrados en el sistema -->
      <div class="col-12 col-lg-6">
        
        <!-- subtitulo de la seccion usuarios -->
        <p class="mb-2 text-white fw-bold small">Usuarios del sistema</p>

        <div class="d-flex flex-column gap-2">
          
          <!-- usuario 1 helian moreno -->
          <div class="tarjeta p-3 rounded-4 d-flex align-items-center gap-3">
            <div class="punto_verde_pequeno me-1" style="width: 24px; height: 24px;"></div>
            <div>
              <p class="m-0 fw-bold text-white small">Helian Moreno</p>
              <p class="m-0 small texto_gris" style="font-size: 11px;">Agrónomo</p>
            </div>
          </div>

          <!-- usuario 2 july riaño -->
          <div class="tarjeta p-3 rounded-4 d-flex align-items-center gap-3">
            <div class="punto_verde_pequeno me-1" style="width: 24px; height: 24px; background-color: #06b6d4;"></div>
            <div>
              <p class="m-0 fw-bold text-white small">July Riaño</p>
              <p class="m-0 small texto_gris" style="font-size: 11px;">Administrador</p>
            </div>
          </div>

          <!-- usuario 3 dayan combita -->
          <div class="tarjeta p-3 rounded-4 d-flex align-items-center gap-3">
            <div class="punto_verde_pequeno me-1" style="width: 24px; height: 24px; background-color: #06b6d4;"></div>
            <div>
              <p class="m-0 fw-bold text-white small">Dayan Combita</p>
              <p class="m-0 small texto_gris" style="font-size: 11px;">Administrador</p>
            </div>
          </div>

        </div>

      </div>

    </div>

  </div>

  <!-- menu de abajo k se queda fijo abajo del monitor para navegar rapido -->
  <div class="navegacion_inferior d-flex justify-content-between">
    <!-- enlace k sube un nivel de carpeta para ir al inicio principal -->
    <a href="../iniciosecion/inicio.html" class="text-center small"><i class="bi bi-house-door d-block"></i>Inicio</a>
    <!-- enlace k navega a la seccion de cultivos -->
    <a href="../cultivos/cultivos.html" class="text-center small"><i class="bi bi-flower1 d-block"></i>Cultivos</a>
    <!-- enlace para la vista del clima -->
    <a href="clima.html" class="text-center small"><i class="bi bi-cloud-sun d-block"></i>Clima</a>
    <!-- enlace k sube un nivel de carpeta para ir a la seccion de insumos -->
    <a href="../insumos/insumos.html" class="text-center small"><i class="bi bi-box-seam d-block"></i>Insumos</a>
    <!-- enlace activo de la vista de perfil -->
    <a href="../perfil/perfil.html" class="text-center small text-success fw-bold"><i class="bi bi-person-circle d-block"></i>Perfil</a>
  </div>

  <!-- script de bootstrap para funciones de javascript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
