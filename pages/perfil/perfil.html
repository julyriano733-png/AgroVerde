<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil - Agro Verde</title>

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="../../assets/vendor/bootstrap/bootstrap.min.css">
  <!-- Íconos de Bootstrap -->
  <link rel="stylesheet" href="../../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <!-- Estilos globales y específicos de Perfil -->
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/perfil/perfil.css">
  <link rel="stylesheet" href="../../assets/css/logo.css">
</head>

<body>
  <img src="../../assets/img/agro-verde-logo.png" alt="Agro Verde" class="logo-app">

  <!-- Pantalla principal fluida -->
  <main class="pantalla container-fluid">

    <!-- Encabezado con título y logo oficial -->
    <header class="d-flex justify-content-between align-items-center mb-4">
      <div class="d-flex align-items-center gap-3">
        <a href="../inicio/inicio.html" class="btn-back" aria-label="Volver">
          <i class="bi bi-arrow-left"></i>
        </a>
        <h4 class="m-0 text-white fw-bold">Perfil</h4>
      </div>
    </header>

    <!-- Estructura en columnas -->
    <div class="row g-4 mb-4">

      <!-- Columna izquierda: Tarjeta principal del usuario y acciones -->
      <div class="col-12 col-lg-6">

        <section class="tarjeta p-4 rounded-4 text-center mb-3">
          <div class="avatar-perfil mx-auto mb-3" id="avatar-usuario"></div>
          <h5 class="m-0 text-white fw-bold mb-1" id="nombre-usuario"></h5>
          <p class="m-0 small texto_gris" id="rol-usuario"></p>
        </section>

        <a href="editar-perfil.html" class="btn-agro-primary d-block text-center text-decoration-none py-3 rounded-4 mb-3 fw-semibold">
          <i class="bi bi-pencil-square me-2"></i>Editar perfil
        </a>
        <a href="../inicio/configuracion.html"
          class="boton_acceso text-center py-3 rounded-4 text-decoration-none d-block mb-3 fw-semibold">
          <i class="bi bi-gear me-2"></i>Configuración
        </a>

        <a href="../inicio-sesion/iniciar-sesion.html" id="cerrar-sesion"
          class="btn_inhabilitar d-block text-center text-decoration-none py-3 rounded-4">
          <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
        </a>

      </div>

      <!-- Columna derecha: Usuarios registrados en el sistema -->
      <div class="col-12 col-lg-6" id="columna-usuarios">

        <p class="mb-2 text-white fw-bold small">Usuarios del sistema</p>

        <div class="d-flex flex-column gap-2" id="lista-usuarios">
          <!-- perfil.js pone aquí los usuarios registrados -->




        </div>

      </div>

    </div>

  </main>

  <!-- Barra de navegación inferior fija -->
  <nav class="navegacion_inferior d-flex justify-content-between">
    <a href="../inicio/inicio.html" class="text-center small"><i class="bi bi-house-door d-block"></i>Inicio</a>
    <a href="../cultivos/cultivos.html" class="text-center small"><i class="bi bi-flower1 d-block"></i>Cultivos</a>
    <a href="../clima/clima.html" class="text-center small"><i class="bi bi-cloud-sun d-block"></i>Clima</a>
    <a href="../insumos/insumos.html" class="text-center small"><i class="bi bi-box-seam d-block"></i>Insumos</a>
    <a href="perfil.html" class="text-center small active"><i class="bi bi-person-circle d-block"></i>Perfil</a>
  </nav>

  <!-- Script de Bootstrap -->
  <script src="../../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/comun.js"></script>
  <script src="../../assets/js/perfil/perfil.js"></script>
    <script src="../../assets/js/confirmacion.js"></script>
  <script src="../../assets/js/conexion.js"></script>
  <script src="../../assets/js/logo.js"></script>

</html>
