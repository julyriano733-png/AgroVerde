<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de plagas - Agro Verde</title>

  <!-- traemos bootstrap para que se vea bien sin complicarme tanto -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- iconos de bootstrap para los botones y la flecha de devolverse -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <!-- estilos globales -->
  <link rel="stylesheet" href="../../assets/css/global.css">
  <!-- estilos generales de plagas -->
  <link rel="stylesheet" href="../../assets/css/plagas/plagas.css">
  <!-- estilos del formulario de plagas -->
  <link rel="stylesheet" href="../../assets/css/plagas/gestion-plagas.css">
  <!-- estilos del catalogo de plagas -->
  <link rel="stylesheet" href="../../assets/css/plagas/catalogo-plagas.css">
</head>

<body>

  <!-- este div es la pantalla principal k en pc se estira a lo ancho para que no quede apretado -->
  <div class="pantalla container-fluid">

    <!-- parte de arriba con el boton de regresar el titulo y el boton de nuevo -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div class="d-flex align-items-center gap-3">
        <!-- boton para devolverse a la pantalla principal de plagas -->
        <a href="plagas.html"
          class="boton_atras text-white text-decoration-none d-flex align-items-center justify-content-center"
          aria-label="Volver a plagas">
          <i class="bi bi-chevron-left fs-5"></i>
        </a>
        <h4 class="m-0 text-white fw-bold">Catálogo de plagas</h4>
      </div>
      <!-- boton verde que conecta con el formulario de nueva plaga -->
      <a href="nueva-plaga.html" class="btn_nuevo text-decoration-none">
        + Nuevo
      </a>
    </div>

    <!-- caja de texto para buscar plagas en el catalogo -->
    <div class="mb-3">
      <input type="text" class="form-control caja_busqueda" id="buscador" placeholder="Buscar plaga"
        aria-label="Buscar plaga">
    </div>

    <!-- botones de filtro por tipo de plaga -->
    <div class="d-flex gap-2 mb-4 overflow-auto pb-1">
      <button type="button" class="filtro_tipo btn_nuevo border-0 py-1 px-3" data-tipo="Todas">Todas</button>
      <button type="button" class="filtro_tipo boton_acceso border-0 py-1 px-3 rounded-4"
        data-tipo="Insecto">Insecto</button>
      <button type="button" class="filtro_tipo boton_acceso border-0 py-1 px-3 rounded-4"
        data-tipo="Ácaro">Ácaro</button>
      <button type="button" class="filtro_tipo boton_acceso border-0 py-1 px-3 rounded-4"
        data-tipo="Hongo">Hongo</button>
      <button type="button" class="filtro_tipo boton_acceso border-0 py-1 px-3 rounded-4"
        data-tipo="Bacteria">Bacteria</button>
    </div>

    <!-- lista de plagas del catalogo (la llena el script) -->
    <div class="row g-3 mb-4" id="lista_catalogo"></div>

    <!-- boton inferior que conecta con la pantalla de inhabilitar plaga -->
    <div class="row justify-content-center mb-4">
      <div class="col-12 col-md-6">
        <a href="inhabilitar-plaga.html"
          class="btn_inhabilitar d-block text-center text-decoration-none py-2">Inhabilitar Plaga</a>
      </div>
    </div>

  </div>

  <!-- ventana con la ficha de la plaga -->
  <div class="modal fade" id="modal_detalle" tabindex="-1" aria-labelledby="titulo_detalle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content ventana_notas">
        <div class="modal-header border-0">
          <h5 class="modal-title" id="titulo_detalle">Plaga</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <small class="texto_gris" id="subtitulo_detalle"></small>
            <span class="insignia" id="riesgo_detalle"></span>
          </div>
          <p class="fw-bold mb-1">¿Cómo se reconoce?</p>
          <p id="descripcion_detalle"></p>
          <p class="fw-bold mb-1">¿Cómo se controla?</p>
          <p id="control_detalle" class="mb-0"></p>
        </div>
        <div class="modal-footer border-0">
          <a href="nueva-plaga.html" id="enlace_registrar"
            class="btn_nuevo text-decoration-none text-center w-100 py-2">Registrar esta plaga</a>
        </div>
      </div>
    </div>
  </div>

  <!-- menu de abajo que se queda fijo abajo del monitor para moverte rapido -->
  <div class="navegacion_inferior d-flex justify-content-between">
    <a href="../inicio/inicio.html" class="text-center small"><i class="bi bi-house-door d-block"></i>Inicio</a>
    <a href="../cultivos/cultivos.html" class="text-center small"><i class="bi bi-flower1 d-block"></i>Cultivos</a>
    <a href="../clima/clima.html" class="text-center small"><i class="bi bi-cloud-sun d-block"></i>Clima</a>
    <a href="../insumos/insumos.html" class="text-center small"><i class="bi bi-box-seam d-block"></i>Insumos</a>
    <a href="../perfil/perfil.html" class="text-center small"><i class="bi bi-person-circle d-block"></i>Perfil</a>
  </div>

  <!-- script de bootstrap para funciones de javascript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- script del catalogo (trae sus propios datos de ejemplo) -->
  <script src="../../assets/js/plagas/catalogo-plagas.js"></script>
</body>

</html>
