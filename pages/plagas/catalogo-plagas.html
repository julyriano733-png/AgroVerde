<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de plagas - Agro Verde</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/css/plagas/catalogo-plagas.css">
</head>
<body>

    <div class="container py-3">

        <!-- Logo Agro Verde -->
            <div class="logo-agroverde d-flex flex-column align-items-center">
                <img src="/assets/img/agro-verde-con-texto.png" alt="Logo Agro Verde" class="img-fluid">
            </div>
        </header>
        <!-- Encabezado -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">Catálogos de plagas</h4>
            <button class="btn btn-verde rounded-pill px-3">+ Nuevo</button>
        </div>

        <!-- Buscador -->
        <input type="text" class="form-control buscador mb-3" placeholder="Buscar plaga">

        <!-- Filtros -->
        <div class="d-flex gap-2 filtros mb-3">
            <button class="chip activo">Todas</button>
            <button class="chip">Insecto</button>
            <button class="chip">Hongo</button>
            <button class="chip">Bacteria</button>
        </div>

        <!-- Lista de plagas -->
        <div class="d-flex flex-column gap-2 mb-4">

            <div class="item-plaga d-flex justify-content-between align-items-center">
                <div>
                    <div class="fw-bold">Gusano cogollero</div>
                    <small>Insecto - Maíz</small>
                </div>
                <span class="nivel nivel-alto">Alto</span>
            </div>

            <div class="item-plaga d-flex justify-content-between align-items-center">
                <div>
                    <div class="fw-bold">Roya del café</div>
                    <small>Hongo - café</small>
                </div>
                <span class="nivel nivel-alto">Alto</span>
            </div>

            <div class="item-plaga d-flex justify-content-between align-items-center">
                <div>
                    <div class="fw-bold">Áfido verde</div>
                    <small>Insecto - Frijol</small>
                </div>
                <span class="nivel nivel-medio">Medio</span>
            </div>

            <div class="item-plaga d-flex justify-content-between align-items-center">
                <div>
                    <div class="fw-bold">Ácaro rojo</div>
                    <small>Ácaro - Tomate</small>
                </div>
                <span class="nivel nivel-medio">Medio</span>
            </div>

            <div class="item-plaga d-flex justify-content-between align-items-center">
                <div>
                    <div class="fw-bold">Antracnosis</div>
                    <small>Hongo - Frijol/Maíz</small>
                </div>
                <span class="nivel nivel-bajo">Bajo</span>
            </div>

        </div>

        <!-- Botón inferior -->
        <button class="btn btn-inhabilitar w-100 rounded-3 py-2">Inhabilitar Plaga</button>

    </div>

    <!-- Barra de navegación inferior -->
   <div class="nav-inferior">
        <div class="item activo"><i class="bi bi-house-door-fill"></i>Inicio</div>
        <div class="item"><i class="bi bi-flower2"></i>Cultivos</div>
        <div class="item"><i class="bi bi-cloud-sun"></i>Clima</div>
        <div class="item"><i class="bi bi-box-seam"></i>Insumos</div>
        <div class="item"><i class="bi bi-person"></i>Perfil</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
