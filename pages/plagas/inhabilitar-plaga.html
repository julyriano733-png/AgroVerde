<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inhabilitar plaga - Agro Verde</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/css/plagas/gestion-plagas.css">
</head>
<body>

    <div class="container py-3">

        <!-- Encabezado -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <a href="plagas.html" class="btn-volver" aria-label="Volver"><i class="bi bi-arrow-left"></i></a>
            <h4 class="mb-0">Inhabilitar plaga</h4>
            <!-- Logo Agro Verde -->
            <div class="logo-agroverde d-flex flex-column align-items-center">
                <img src="/assets/img/agro-verde-con-texto.png" alt="Logo Agro Verde" class="img-fluid">
            </div>
        </header>
        </div>

        <!-- Buscador -->
        <input type="text" class="form-control buscador mb-3" placeholder="Buscar plaga">

        <form>
            <!-- Lista -->
            <div class="d-flex flex-column gap-2 mb-4">

                <label class="item-plaga d-flex align-items-center gap-3">
                    <input type="radio" class="form-check-input radio-plaga" name="plaga" value="cogollero">
                    <div class="flex-grow-1">
                        <div class="fw-bold">Cogollero - Lote 1</div>
                        <small>Etapa: leve</small>
                    </div>
                    <span class="estado estado-optimo">Óptimo</span>
                </label>

                <label class="item-plaga d-flex align-items-center gap-3">
                    <input type="radio" class="form-check-input radio-plaga" name="plaga" value="broca">
                    <div class="flex-grow-1">
                        <div class="fw-bold">Broca del café - Lote 2</div>
                        <small>Etapa: inicial</small>
                    </div>
                    <span class="estado estado-revisar">Revisar</span>
                </label>

                <label class="item-plaga d-flex align-items-center gap-3">
                    <input type="radio" class="form-check-input radio-plaga" name="plaga" value="mosca-blanca">
                    <div class="flex-grow-1">
                        <div class="fw-bold">Mosca blanca - Lote 3</div>
                        <small>Etapa: riesgo bajo</small>
                    </div>
                    <span class="estado estado-alerta">Alerta plaga</span>
                </label>

                <label class="item-plaga d-flex align-items-center gap-3">
                    <input type="radio" class="form-check-input radio-plaga" name="plaga" value="polilla">
                    <div class="flex-grow-1">
                        <div class="fw-bold">Polilla - Lote 4</div>
                        <small>Etapa: avanzada</small>
                    </div>
                    <span class="estado estado-optimo">Óptimo</span>
                </label>

            </div>

            <button type="submit" class="btn btn-inhabilitar w-100 rounded-3 py-2">Inhabilitar Plaga</button>
        </form>

    </div>

    <!-- Barra de navegación inferior -->
   <div class="nav-inferior">
        <div class="item activo"><i class="bi bi-house-door-fill"></i>Inicio</div>
        <div class="item"><i class="bi bi-flower2"></i>Cultivos</div>
        <div class="item"><i class="bi bi-cloud-sun"></i>Clima</div>
        <div class="item"><i class="bi bi-box-seam"></i>Insumos</div>
        <div class="item"><i class="bi bi-person"></i>Perfil</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
