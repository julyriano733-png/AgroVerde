<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modificar plaga - Agro Verde</title>

  <!-- traemos bootstrap para que se vea bien sin complicarme tanto -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- iconos de bootstrap para los botones y la flecha de devolverse -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <!-- estilos globales -->
  <link rel="stylesheet" href="../../assets/css/global.css">
  <!-- estilos generales de plagas -->
  <link rel="stylesheet" href="../../assets/css/plagas/plagas.css">
  <!-- estilos del formulario de plagas -->
  <link rel="stylesheet" href="../../assets/css/plagas/gestion-plagas.css">
</head>

<body>

  <!-- este div es la pantalla principal que en pc se acomoda centrada para que no quede estirada -->
  <div class="pantalla container-fluid">

    <!-- la parte de arriba con el boton de regresar y el titulo de la pagina -->
    <div class="d-flex align-items-center mb-4 gap-3">
      <!-- boton para devolverse a la pantalla principal de plagas -->
      <a href="plagas.html"
        class="boton_atras text-white text-decoration-none d-flex align-items-center justify-content-center"
        aria-label="Volver a plagas">
        <i class="bi bi-chevron-left fs-5"></i>
      </a>
      <h4 class="m-0 text-white fw-bold">Modificar plaga</h4>
    </div>

    <!-- formulario y resumen metidos en una tarjeta centrada para que se vea bien en pc y cel -->
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="tarjeta p-4 rounded-4" id="contenido_modificar">

          <!-- tarjeta de resumen de los datos actuales de la plaga (la llena el script) -->
          <div class="tarjeta p-3 rounded-4 mb-4" style="background-color: rgba(255, 255, 255, 0.05);">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <span class="fw-bold text-white" id="resumen_ubicacion"></span>
              <span class="insignia insignia_revisar" id="resumen_nombre"></span>
            </div>
            <div class="d-flex justify-content-between align-items-center">
              <span class="insignia" id="resumen_estado"></span>
              <span class="small texto_gris" id="resumen_fecha"></span>
            </div>
          </div>

          <form id="formulario_plaga">

            <!-- mensaje de error (lo muestra el script) -->
            <div id="aviso_error" class="alert alert-danger py-2 small d-none" role="alert"></div>

            <!-- campo para modificar el nombre de la plaga -->
            <div class="mb-3">
              <label for="nombre" class="form-label text-white small fw-bold">Nombre de la plaga</label>
              <input type="text" class="form-control caja_busqueda" id="nombre" name="nombre" required>
            </div>

            <!-- campo para cambiar la fecha de inicio -->
            <div class="mb-3">
              <label for="fecha" class="form-label text-white small fw-bold">Fecha de inicio</label>
              <input type="date" class="form-control caja_busqueda" id="fecha" name="fecha" required>
            </div>

            <!-- campo para modificar la ubicacion o cultivo -->
            <div class="mb-3">
              <label for="ubicacion" class="form-label text-white small fw-bold">Ubicación</label>
              <input type="text" class="form-control caja_busqueda" id="ubicacion" name="ubicacion" required>
            </div>

            <!-- campo para cambiar el estado de la plaga -->
            <div class="mb-3">
              <label for="estado" class="form-label text-white small fw-bold">Estado</label>
              <select class="form-select caja_busqueda" id="estado" name="estado" required>
                <option value="Iniciada">Iniciada</option>
                <option value="Moderada">Moderada</option>
                <option value="Avanzada">Avanzada</option>
                <option value="Controlada">Controlada</option>
              </select>
            </div>

            <!-- cuadro de texto para agregar o editar notas -->
            <div class="mb-4">
              <label for="notas" class="form-label text-white small fw-bold">Notas</label>
              <textarea class="form-control caja_busqueda" id="notas" name="notas" rows="4"
                placeholder="Observaciones adicionales..."></textarea>
            </div>

            <!-- boton verde para guardar los cambios y actualizar -->
            <button type="submit" class="btn_nuevo w-100 py-2 border-0 text-center">Actualizar Información</button>

          </form>

        </div>
      </div>
    </div>

  </div>

  <!-- menu de abajo que se queda fijo abajo del monitor para moverte rapido -->
  <div class="navegacion_inferior d-flex justify-content-between">
    <a href="../inicio/inicio.html" class="text-center small"><i class="bi bi-house-door d-block"></i>Inicio</a>
    <a href="../cultivos/cultivos.html" class="text-center small"><i class="bi bi-flower1 d-block"></i>Cultivos</a>
    <a href="../clima/clima.html" class="text-center small"><i class="bi bi-cloud-sun d-block"></i>Clima</a>
    <a href="../insumos/insumos.html" class="text-center small"><i class="bi bi-box-seam d-block"></i>Insumos</a>
    <a href="../perfil/perfil.html" class="text-center small"><i class="bi bi-person-circle d-block"></i>Perfil</a>
  </div>

  <!-- script de bootstrap para funciones de javascript -->
