<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar plaga - Agro Verde</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/css/plagas/gestion-plagas.css">
</head>
<body>

    <div class="container py-3">

        <!-- Encabezado -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <a href="plagas.html" class="btn-volver" aria-label="Volver"><i class="bi bi-arrow-left"></i></a>
            <h4 class="mb-0">Modificar plaga</h4>
           <!-- Logo Agro Verde -->
            <div class="logo-agroverde d-flex flex-column align-items-center">
                <img src="/assets/img/agro-verde-con-texto.png" alt="Logo Agro Verde" class="img-fluid">
            </div>
        </header>
        </div>

        <!-- Resumen -->
        <div class="resumen mb-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="fw-bold">Maíz - Lote 1</span>
                <span class="badge badge-estado rounded-pill px-3 py-2">Gusano</span>
            </div>
            <div class="d-flex justify-content-between align-items-center">
                <span class="badge badge-estado rounded-pill px-3 py-2">Avanzada</span>
                <span class="badge badge-estado rounded-pill px-3 py-2">14/06/2026</span>
            </div>
        </div>

        <form>
            <div class="mb-3">
                <label for="nombre" class="etiqueta">Nombre de la plaga</label>
                <input type="text" class="form-control campo" id="nombre" name="nombre" value="Gusano">
            </div>

            <div class="mb-3">
                <label for="fecha" class="etiqueta">Fecha de inicio</label>
                <input type="date" class="form-control campo" id="fecha" name="fecha" value="2026-06-14">
            </div>

            <div class="mb-3">
                <label for="ubicacion" class="etiqueta">Ubicación</label>
                <input type="text" class="form-control campo" id="ubicacion" name="ubicacion" value="Maíz - Lote 1">
            </div>

            <div class="mb-4">
                <label for="notas" class="etiqueta">Notas</label>
                <textarea class="form-control campo" id="notas" name="notas" rows="4" placeholder="Observaciones adicionales..."></textarea>
            </div>

            <button type="submit" class="btn btn-actualizar w-100 rounded-3 py-2">Actualizar Información</button>
        </form>

    </div>

    <!-- Barra de navegación inferior -->
  <div class="nav-inferior">
        <div class="item activo"><i class="bi bi-house-door-fill"></i>Inicio</div>
        <div class="item"><i class="bi bi-flower2"></i>Cultivos</div>
        <div class="item"><i class="bi bi-cloud-sun"></i>Clima</div>
        <div class="item"><i class="bi bi-box-seam"></i>Insumos</div>
        <div class="item"><i class="bi bi-person"></i>Perfil</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
