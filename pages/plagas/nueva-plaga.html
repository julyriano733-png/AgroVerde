<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva plaga - Agro Verde</title>
  
  <!-- Bootstrap 5 CSS (Versión estable) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Íconos de Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <!-- Estilos del CSS de Plagas -->
  <link rel="stylesheet" href="../../assets/css/plagas/gestion-plagas.css">
</head>
<body>

  <!-- Pantalla principal -->
  <div class="pantalla container-fluid">

    <!-- Encabezado con botón de regresó y título -->
    <div class="d-flex align-items-center mb-4 gap-3">
      <a href="plagas.html" class="boton_atras text-white text-decoration-none d-flex align-items-center justify-content-center">
        <i class="bi bi-chevron-left fs-5"></i>
      </a>
      <h4 class="m-0 text-white fw-bold">Nueva plaga</h4>
    </div>

    <!-- Formulario de registro -->
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="tarjeta p-4 rounded-4">
          
          <form action="plagas.html" method="GET">
            
            <!-- Nombre de la plaga -->
            <div class="mb-3">
              <label for="nombre" class="form-label text-white small fw-bold">Nombre de la plaga</label>
              <input type="text" class="form-control caja_busqueda" id="nombre" name="nombre" placeholder="Ej. polilla" required>
            </div>

            <!-- Fecha de inicio -->
            <div class="mb-3">
              <label for="fecha" class="form-label text-white small fw-bold">Fecha de inicio</label>
              <input type="date" class="form-control caja_busqueda" id="fecha" name="fecha" required>
            </div>

            <!-- Ubicación / Cultivo / Lote -->
            <div class="mb-3">
              <label for="ubicacion" class="form-label text-white small fw-bold">Ubicación</label>
              <input type="text" class="form-control caja_busqueda" id="ubicacion" name="ubicacion" placeholder="Ej. cultivo1 o lote 2" required>
            </div>

            <!-- Notas u observaciones -->
            <div class="mb-4">
              <label for="notas" class="form-label text-white small fw-bold">Notas</label>
              <textarea class="form-control caja_busqueda" id="notas" name="notas" rows="4" placeholder="Observaciones adicionales..."></textarea>
            </div>

            <!-- Botón de guardar -->
            <button type="submit" class="btn_nuevo w-100 py-2 border-0 text-center">Guardar plaga</button>

          </form>

        </div>
      </div>
    </div>

  </div>

  <!-- Menú de navegación inferior fijo -->
  <nav class="navegacion_inferior d-flex justify-content-between">
    <a href="../iniciosecion/inicio.html" class="text-center small"><i class="bi bi-house-door d-block"></i>Inicio</a>
    <a href="../cultivos/ver-cultivo.html" class="text-center small"><i class="bi bi-flower1 d-block"></i>Cultivos</a>
    <a href="../clima/ver-clima.html" class="text-center small"><i class="bi bi-cloud-sun d-block"></i>Clima</a>
    <a href="../insumos/insumos.html" class="text-center small"><i class="bi bi-box-seam d-block"></i>Insumos</a>
    <a href="../perfil/perfil.html" class="text-center small"><i class="bi bi-person-circle d-block"></i>Perfil</a>
  </nav>

  <!-- Script de Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
