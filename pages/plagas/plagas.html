<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plagas - Agro Verde</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Íconos de Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <!-- Estilos globales y específicos de Plagas -->
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/plagas/plagas.css">
</head>

<body>

  <!-- Pantalla principal -->
  <main class="pantalla container-fluid">

    <!-- Encabezado con título, logo y botón de nuevo registro -->
    <header class="d-flex justify-content-between align-items-center mb-4">
      <div class="d-flex align-items-center gap-3">
        <a href="../inicio/inicio.html" class="btn-back" aria-label="Volver">
          <i class="bi bi-arrow-left"></i>
        </a>
        <h4 class="m-0 text-white fw-bold">Plagas</h4>
        <img src="../../assets/img/agro-verde-sin-texto.png" alt="Agro Verde" class="app-logo-mini">
      </div>
      <a href="nueva-plaga.html" class="btn_nuevo text-decoration-none">
        + Nuevo
      </a>
    </header>

    <!-- Mensaje de confirmación (la llena plagas.js) -->
    <div id="aviso_plagas"></div>

    <!-- Tarjeta de resumen de alertas (la llena plagas.js) -->
    <section class="tarjeta p-3 rounded-4 mb-4" id="resumen_alertas"></section>

    <!-- Lista de tarjetas de plagas (la llena plagas.js) -->
    <div class="row g-3 mb-4" id="lista_plagas"></div>

    <!-- Accesos a Catálogo e Inhabilitar -->
    <div class="row g-2 mb-4">
      <div class="col-12 col-md-6">
        <a href="catalogo-plagas.html"
          class="boton_acceso text-center py-3 rounded-4 text-decoration-none d-block fw-semibold">
          <i class="bi bi-journal-bookmark me-1 text-success"></i> Catálogo de plagas
        </a>
      </div>
      <div class="col-12 col-md-6">
        <a href="inhabilitar-plaga.html"
          class="boton_acceso text-center py-3 rounded-4 text-decoration-none d-block fw-semibold text-danger">
          <i class="bi bi-trash me-1"></i> Inhabilitar Plaga
        </a>
      </div>
    </div>

  </main>

  <!-- Ventana emergente de notas -->
  <div class="modal fade" id="modal_notas" tabindex="-1" aria-labelledby="titulo_notas" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content ventana_notas">
        <div class="modal-header border-0">
          <h5 class="modal-title" id="titulo_notas">Notas</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body" id="texto_notas"></div>
      </div>
    </div>
  </div>

  <!-- Menú de navegación inferior fijo -->
  <nav class="navegacion_inferior d-flex justify-content-between">
    <a href="../inicio/inicio.html" class="text-center small"><i class="bi bi-house-door d-block"></i>Inicio</a>
    <a href="../cultivos/cultivos.html" class="text-center small"><i class="bi bi-flower1 d-block"></i>Cultivos</a>
    <a href="../clima/clima.html" class="text-center small"><i class="bi bi-cloud-sun d-block"></i>Clima</a>
    <a href="../insumos/insumos.html" class="text-center small"><i class="bi bi-box-seam d-block"></i>Insumos</a>
    <a href="../perfil/perfil.html" class="text-center small"><i class="bi bi-person-circle d-block"></i>Perfil</a>
  </nav>

  <!-- Script de Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Scripts de Plagas (el orden importa: primero los datos) -->
  <script src="../../assets/js/plagas/datos-plagas.js"></script>
  <script src="../../assets/js/plagas/plagas.js"></script>
</body>

</html>
