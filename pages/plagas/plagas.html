<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plagas - Agro Verde</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/css/plagas/plagas.css">
</head>
<body>

    <div class="container py-3">

        <!-- Encabezado -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">Plagas</h4>
           <!-- Logo Agro Verde -->
            <div class="logo-agroverde d-flex flex-column align-items-center">
                <img src="/assets/img/agro-verde-con-texto.png" alt="Logo Agro Verde" class="img-fluid">
            </div>
        </header>
            <button class="btn btn-verde rounded-pill px-3">+ Nuevo</button>
        </div>

        <!-- Tarjeta de alertas -->
        <div class="card card-custom p-3 mb-4">
            <div class="d-flex align-items-center mb-2">
                <span class="punto bg-danger"></span>
                <span class="ms-2">Plaga detectada en lote 3</span>
            </div>
            <div class="d-flex align-items-center mb-2">
                <span class="punto bg-info"></span>
                <span class="ms-2">Plaga detectada en lote 3</span>
            </div>
            <div class="d-flex align-items-center">
                <span class="punto bg-success"></span>
                <span class="ms-2">Plaga detectada en lote 3</span>
            </div>
        </div>

        <!-- Tarjeta Maíz -->
        <div class="card card-custom p-3 mb-3">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <h5>Maíz - Lote 1</h5>
                    <span class="badge badge-estado rounded-pill px-3 py-2">Avanzada</span>
                </div>
                <div class="text-end">
                    <div>Gusano</div>
                    <div>14/06/2026</div>
                </div>
            </div>
            <div class="d-flex gap-2 mt-3">
                <button class="btn btn-verde rounded-pill flex-fill">Notas</button>
                <button class="btn btn-verde rounded-pill flex-fill">Modificar</button>
            </div>
        </div>

        <!-- Tarjeta Café -->
        <div class="card card-custom p-3 mb-4">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <h5>Café - Lote 2</h5>
                    <span class="badge badge-estado rounded-pill px-3 py-2">Iniciada</span>
                </div>
                <div class="text-end">
                    <div>broca del café</div>
                    <div>14/06/2026</div>
                </div>
            </div>
            <div class="d-flex gap-2 mt-3">
                <button class="btn btn-verde rounded-pill flex-fill">Notas</button>
                <button class="btn btn-verde rounded-pill flex-fill">Modificar</button>
            </div>
        </div>

        <!-- Botones grandes -->
        <button class="btn btn-catalogo w-100 rounded-pill mb-3 py-2">Catalogo de plagas</button>
        <button class="btn btn-inhabilitar w-100 rounded-pill py-2">Inhabilitar Plaga</button>

    </div>

    <!-- Barra de navegación inferior -->
   <div class="nav-inferior">
        <div class="item activo"><i class="bi bi-house-door-fill"></i>Inicio</div>
        <div class="item"><i class="bi bi-flower2"></i>Cultivos</div>
        <div class="item"><i class="bi bi-cloud-sun"></i>Clima</div>
        <div class="item"><i class="bi bi-box-seam"></i>Insumos</div>
        <div class="item"><i class="bi bi-person"></i>Perfil</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
