<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva propiedad - Agro Verde</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Estilos Personalizados Agro Verde -->
    <link rel="stylesheet" href="/assets/css/propiedad/crear-propiedad.css">
</head>

<body class="d-flex flex-column min-vh-100 py-4 py-md-5">

    <!-- Contenedor Web de Escritorio -->
    <main class="container-lg my-auto">

        <!-- Encabezado -->
        <header class="d-flex align-items-center justify-content-between mb-4 pb-2">
            <div class="d-flex align-items-center gap-3">
                <button class="boton-volver d-flex align-items-center justify-content-center" aria-label="Volver">
                    <i class="bi bi-arrow-left fs-5"></i>
                </button>
                <h1 class="titulo-pagina m-0 fs-2">Nueva propiedad</h1>
            </div>

            <!-- Logo Agro Verde -->
            <div class="logo-agroverde d-flex flex-column align-items-center">
                <img src="/assets/img/agro-verde-con-texto.png" alt="Logo Agro Verde" class="img-fluid">
            </div>
        </header>

        <!-- Formulario de Registro -->
        <form id="formNuevaPropiedad" class="d-flex flex-column gap-4">

            <!-- Campo: Nombre de la propiedad -->
            <div class="grupo-campo">
                <label for="nombrePropiedad" class="form-label label-personalizado">Nombre de la propiedad</label>
                <input type="text" id="nombrePropiedad" class="form-control campo-personalizado"
                    placeholder="Ej. napoles" required>
            </div>

            <!-- Campo: Ubicación -->
            <div class="grupo-campo">
                <label for="ubicacionPropiedad" class="form-label label-personalizado">Ubicacion</label>
                <input type="text" id="ubicacionPropiedad" class="form-control campo-personalizado"
                    placeholder="Ej. sur,norte" required>
            </div>

            <!-- Campo: Notas -->
            <div class="grupo-campo">
                <label for="notasPropiedad" class="form-label label-personalizado">Notas</label>
                <textarea id="notasPropiedad" class="form-control campo-personalizado textarea-personalizado" rows="4"
                    placeholder="Ej. Finca, hato, lote"></textarea>
            </div>

            <!-- Separador -->
            <div class="separador my-2"></div>

            <!-- Botón Guardar Propiedad -->
            <div class="d-flex justify-content-center">
                <button type="submit" class="boton-guardar w-100 py-3 fw-bold">Guardar propiedad</button>
            </div>

        </form>

    </main>
</body>

</html>
