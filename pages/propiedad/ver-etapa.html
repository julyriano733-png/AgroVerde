<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etapa - Finca el manantial | Agro Verde</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Estilos Personalizados Agro Verde -->
    <link rel="stylesheet" href="/assets/css/propiedad/ver-etapa.css">
</head>

<body class="d-flex flex-column min-vh-100 py-4 py-md-5">

    <!-- Contenedor Principal Web de Escritorio -->
    <main class="container-lg my-auto">

        <!-- Encabezado -->
        <header class="d-flex align-items-center justify-content-between mb-4 pb-2">
            <div class="d-flex align-items-center gap-3">
                <button class="boton-volver d-flex align-items-center justify-content-center" aria-label="Volver">
                    <i class="bi bi-arrow-left fs-5"></i>
                </button>
                <div>
                    <span class="subtitulo-header d-block">Etapa</span>
                    <h1 class="titulo-pagina m-0 fs-2">Finca el manantial</h1>
                </div>
            </div>

            <!-- Logo Agro Verde -->
            <div class="logo-agroverde d-flex flex-column align-items-center">
                <img src="/assets/img/agro-verde-con-texto.png" alt="Logo Agro Verde" class="img-fluid">
            </div>
        </header>

        <!-- Tarjeta Detalle de la Etapa -->
        <section class="tarjeta-detalle p-4 p-md-5">

            <!-- Fila Principal: Descripción y Badge Óptimo -->
            <div class="d-flex justify-content-between align-items-start mb-3">
                <div>
                    <span class="etiqueta-seccion">Descripción</span>
                    <h2 class="titulo-lote m-0 mt-1">Maíz - Lote 1</h2>
                </div>
                <span class="badge-optimo">Óptimo</span>
            </div>

            <hr class="linea-divisora">

            <!-- Fila: Región -->
            <div class="d-flex justify-content-between align-items-center py-2">
                <span class="etiqueta-campo">región</span>
                <span class="valor-campo">valle del cauca</span>
            </div>

            <hr class="linea-divisora">

            <!-- Fila: Área -->
            <div class="d-flex justify-content-between align-items-center py-2">
                <span class="etiqueta-campo">Área</span>
                <span class="valor-campo">0,8 ha</span>
            </div>

            <hr class="linea-divisora">

            <!-- Fila: Etapa -->
            <div class="d-flex justify-content-between align-items-center py-2">
                <span class="etiqueta-campo">Etapa</span>
                <span class="valor-campo">inicio</span>
            </div>

            <hr class="linea-divisora">

            <!-- Fila: Descripción Ambiental -->
            <div class="py-2">
                <span class="etiqueta-campo d-block mb-2">Descripción</span>
                <p class="texto-ambiental m-0">
                    1.750 metros sobre el nivel del mar, en zona rural del municipio del valle del cauca.
                </p>
            </div>

            <hr class="linea-divisora">

            <!-- Fila Inferior: Porcentaje Humedad -->
            <div class="d-flex justify-content-end align-items-center pt-2">
                <div class="d-flex align-items-center gap-2 porcentaje-azul fw-bold">
                    <span>Humedad</span>
                    <i class="bi bi-droplet-half"></i>
                    <span>62%</span>
                </div>
            </div>

        </section>

    </main>

</body>

</html>
