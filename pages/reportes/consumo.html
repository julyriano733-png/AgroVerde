<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes de Consumo - Agro Verde</title>
    <link rel="stylesheet" href="../../assets/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/reportes/reportes.css">
  <link rel="stylesheet" href="../../assets/css/logo.css">
</head>

<body>
  <img src="../../assets/img/agro-verde-logo.png" alt="Agro Verde" class="logo-app">
    <main class="pantalla container-fluid">
        <header class="app-header">
            <div class="app-header__left">
                <a href="reportes.html" class="btn-back" aria-label="Volver"><i class="bi bi-arrow-left"></i></a>
                <h4 class="m-0 fw-bold">Reportes de consumo</h4>
            </div>
        </header>

        <div class="mx-auto" style="max-width: 600px;">
            <div class="d-flex flex-column gap-2 mb-4">
                <div class="tarjeta p-3 rounded-4 d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-3">
                        <span class="punto_verde_pequeno"></span>
                        <div>
                            <strong class="d-block small">Consumo semanal</strong>
                            <span class="texto_gris" style="font-size: 0.75rem;">Últimos 7 días</span>
                        </div>
                    </div>
                    <span class="fw-bold small" id="consumoSemanal">42 kg</span>
                </div>

                <div class="tarjeta p-3 rounded-4 d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-3">
                        <span class="punto_azul_pequeno"></span>
                        <div>
                            <strong class="d-block small">Consumo mensual</strong>
                            <span class="texto_gris" style="font-size: 0.75rem;" id="consumoMes">Agosto 2026</span>
                        </div>
                    </div>
                    <span class="fw-bold small" id="consumoMensual">185 kg</span>
                </div>

                <div class="tarjeta p-3 rounded-4 d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-3">
                        <span class="punto_amarillo_pequeno"></span>
                        <div>
                            <strong class="d-block small">Insumo más usado</strong>
                            <span class="texto_gris" style="font-size: 0.75rem;" id="consumoInsumo">Urea 46%</span>
                        </div>
                    </div>
                    <span class="fw-bold small" id="consumoPorcentaje">38%</span>
                </div>
            </div>

            <button type="button" class="btn-agro-primary no-imprimir" onclick="document.title = 'Reporte de consumo - Agro Verde'; window.print();"><i class="bi bi-file-earmark-pdf me-1"></i> Exportar reporte en PDF</button>
        </div>
    </main>

    <!-- Menú flotante desplegable hacia arriba (dropup) -->
    <div class="contenedor_menu_flotante dropup">
      <button class="boton_mas_flotante dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Más opciones">
        <i class="bi bi-list"></i>
      </button>
      <div class="dropdown-menu panel_monitoreo dropdown-menu-end shadow">
        <div class="encabezado_panel">
          <i class="bi bi-bar-chart-fill me-2"></i> Opciones de consumo
        </div>
        <div class="cuerpo_panel">
        <a href="#" onclick="window.print(); return false;" class="dropdown-item opcion_panel">
          <i class="bi bi-file-earmark-arrow-down icon"></i> Exportar reporte
        </a>
        <a href="../insumos/insumos-usados.html" class="dropdown-item opcion_panel">
          <i class="bi bi-box-seam icon"></i> Insumos usados
        </a>
        <a href="../insumos/costos-por-insumo.html" class="dropdown-item opcion_panel">
          <i class="bi bi-cash-coin icon"></i> Costos por insumo
        </a>
        <a href="../insumos/grafica-insumos.html" class="dropdown-item opcion_panel">
          <i class="bi bi-graph-up icon"></i> Gráfica de insumos
        </a>
        <a href="reportes.html" class="dropdown-item opcion_panel">
          <i class="bi bi-file-earmark-text icon"></i> Ver reportes
        </a>
        </div>
      </div>
    </div>

    <nav class="navegacion_inferior d-flex justify-content-between">
        <a href="../inicio/inicio.html" class="text-center small"><i class="bi bi-house-door d-block"></i>Inicio</a>
        <a href="../cultivos/cultivos.html" class="text-center small"><i class="bi bi-flower1 d-block"></i>Cultivos</a>
        <a href="../clima/clima.html" class="text-center small"><i class="bi bi-cloud-sun d-block"></i>Clima</a>
        <a href="../insumos/insumos.html" class="text-center small"><i class="bi bi-box-seam d-block"></i>Insumos</a>
        <a href="../perfil/perfil.html" class="text-center small"><i class="bi bi-person-circle d-block"></i>Perfil</a>
    </nav>
    <script src="../../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/comun.js"></script>
    <script src="../../assets/js/permisos.js"></script>
    <script src="../../assets/js/insumos/datos-insumos.js"></script>
    <script src="../../assets/js/reportes/reportes.js"></script>
  <script src="../../assets/js/conexion.js"></script>
  <script src="../../assets/js/logo.js"></script>
</body>

</html>
