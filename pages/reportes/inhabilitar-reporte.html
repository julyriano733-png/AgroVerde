<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../../assets/vendor/bootstrap/bootstrap.min.css">

<body>
  <img src="../../assets/img/agro-verde-logo.png" alt="Agro Verde" class="logo-app">
    <main class="pantalla container-fluid">
        <header class="app-header">
            <div class="app-header__left">
                <a href="reportes.html" class="btn-back" aria-label="Volver"><i class="bi bi-arrow-left"></i></a>
                <h4 class="m-0 fw-bold">Reportes</h4>
            </div>
        </header>

        <div class="mx-auto" style="max-width: 600px;">
            <p class="small fw-semibold mb-3">Informes disponibles</p>

            <div class="d-flex flex-column gap-2 mb-4" id="listaInhabilitarReportes">
                <label class="tarjeta p-3 rounded-4 d-flex align-items-center gap-3" style="cursor: pointer;">
                    <input type="checkbox" name="reportesSeleccionados" value="1" class="form-check-input m-0">
                    <div>
                        <strong class="d-block small">Informe mensual - Lote 1</strong>
                        <span class="texto_gris" style="font-size: 0.75rem;">Generado 15 Ago 2026</span>
                    </div>
                </label>

                <label class="tarjeta p-3 rounded-4 d-flex align-items-center gap-3" style="cursor: pointer;">
                    <input type="checkbox" name="reportesSeleccionados" value="2" class="form-check-input m-0">
                    <div>
                        <strong class="d-block small">Uso de insumos Q2</strong>
                        <span class="texto_gris" style="font-size: 0.75rem;">Generado 10 Ago 2026</span>
                    </div>
                </label>

                <label class="tarjeta p-3 rounded-4 d-flex align-items-center gap-3" style="cursor: pointer;">
                    <input type="checkbox" name="reportesSeleccionados" value="3" class="form-check-input m-0">
                    <div>
                        <strong class="d-block small">Rendimiento por lote</strong>
                        <span class="texto_gris" style="font-size: 0.75rem;">Generado 02 Ago 2026</span>
                    </div>
                </label>
            </div>

            <a href="reportes.html?mensaje=inhabilitado" class="btn-agro-danger" id="botonInhabilitarReporte">Inhabilitar Reporte</a>
        </div>
    </main>

        <a href="../insumos/insumos.html" class="text-center small"><i class="bi bi-box-seam d-block"></i>Insumos</a>
        <a href="../perfil/perfil.html" class="text-center small"><i class="bi bi-person-circle d-block"></i>Perfil</a>
    </nav>
