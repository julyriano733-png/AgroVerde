<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Terrenos - Agro Verde</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/assets/css/terreno/historial-terrenos.css">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="container">

    <!-- Encabezado de la vista -->
    <div class="header-historial my-4">
        <h3 class="fw-bold mb-1">Historial de terrenos</h3>
        <p class="subtitulo mb-0">Cambios y registros por parcela</p>
    </div>

    <!-- Lista de tarjetas del historial -->
    <div class="card tarjeta-historial mb-3">
        <div class="d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <span class="punto-indicador punto-verde"></span>
                <div>
                    <h6 class="mb-0 fw-semibold">Lote 3 - Maíz</h6>
                    <small class="detalle">Área actualizada: 2.4 ha</small>
                </div>
            </div>
            <span class="fecha">15 Ago 2026</span>
        </div>
    </div>

    <div class="card tarjeta-historial mb-3">
        <div class="d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <span class="punto-indicador punto-azul"></span>
                <div>
                    <h6 class="mb-0 fw-semibold">Lote 1 - Café</h6>
                    <small class="detalle">Fuente de agua asociada</small>
                </div>
            </div>
            <span class="fecha">02 Ago 2026</span>
        </div>
    </div>

    <div class="card tarjeta-historial mb-3">
        <div class="d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <span class="punto-indicador punto-amarillo"></span>
                <div>
                    <h6 class="mb-0 fw-semibold">Lote 2 - Fríjol</h6>
                    <small class="detalle">Tipo de suelo registrado: Franco</small>
                </div>
            </div>
            <span class="fecha">28 Jul 2026</span>
        </div>
    </div>

    <div class="card tarjeta-historial mb-3">
        <div class="d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <span class="punto-indicador punto-verde"></span>
                <div>
                    <h6 class="mb-0 fw-semibold">Lote 3 - Maíz</h6>
                    <small class="detalle">Parcela creada</small>
                </div>
            </div>
            <span class="fecha">12 Ene 2026</span>
        </div>
    </div>

    <!-- NAVEGACIÓN INFERIOR FIJA -->
    <!-- NAVEGACIÓN INFERIOR FIJA -->
    <div class="nav-inferior">
        <div class="item activo"><i class="bi bi-house-door-fill"></i>Inicio</div>
        <div class="item"><i class="bi bi-flower2"></i>Cultivos</div>
        <div class="item"><i class="bi bi-cloud-sun"></i>Clima</div>
        <div class="item"><i class="bi bi-box-seam"></i>Insumos</div>
        <div class="item"><i class="bi bi-person"></i>Perfil</div>
    </div>

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>


</html>
